id: eng:instant-to-local-day
name: Instant to local day
decision: >-
  A stored instant becomes a calendar day in the viewer's local zone through one shared helper,
  never by slicing its UTC ISO timestamp.
context: >-
  Slicing the ISO string yields UTC's calendar day — tomorrow every evening for users behind UTC — a
  bug invisible in UTC CI and reintroduced until the conversion was named and every site pointed at
  it.
