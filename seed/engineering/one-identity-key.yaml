name: One identity key
decisions:
  - id: principle:one-identity-key
    decision: >-
      One canonical identity key identifies a person; accounts are a convenience layered on top of
      the key; ownership is proven through the key's own channel; and the key is normalized and
      validated at every boundary that creates identities.
context:
  why: >-
    de-skinned from an email-keyed ruling: a single normalized key lets identities exist before
    accounts do and keeps every minting boundary honest
  src: adroit seed v1, distilled from StageDoor's ledger (principle:email-identity)
