id: principle:one-identity-key
name: One identity key
decision: >-
  One canonical identity key identifies a person; accounts are a convenience layered on top of the
  key; ownership is proven through the key's own channel; and the key is normalized and validated at
  every boundary that creates identities.
context: >-
  A single normalized key lets identities exist before accounts do and keeps every minting boundary
  honest.
