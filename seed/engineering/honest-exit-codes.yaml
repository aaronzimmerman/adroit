id: eng:honest-exit-codes
name: Honest exit codes
decision: >-
  Verdicts come from the tool's own exit status, never a pipeline that masks it; a change is done
  only when the full suite passes from a clean build.
context: >-
  A piped filter once reported a failing suite as exit 0, and a regression appeared only in the full
  suite — so "done" means the tool's own exit code on the full clean run.
