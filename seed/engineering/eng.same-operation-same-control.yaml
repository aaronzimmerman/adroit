id: eng:same-operation-same-control
decision: >-
  An operation that exists on more than one surface renders as the SAME control
  everywhere: one shared component, wired per entity (an endpoint base, a reload), never
  per-surface copies. The user learns an interaction once; a surface that needs the
  operation mounts the component rather than rebuilding it.
rejected:
  - >-
    per-surface implementations of one operation — each copy drifts in wording, placement
    and behavior, and the user re-learns the interaction on every surface
  - >-
    uniformity by style guide alone — a written convention without a shared component is
    a wish; the component is the enforcement
links:
  domain: eng
context:
  why: >-
    interactions should be the same as much as possible, and the shared component is what
    makes the sameness mechanical rather than aspirational
  src: adroit seed v1, distilled from StageDoor's ledger (eng:same-operation-same-control)
