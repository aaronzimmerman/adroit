id: eng:defaults-are-likely-usage
decision: >-
  Interactions let users do things as expeditiously as possible: where a gesture offers a
  choice, the default is the most likely usage, so the common case is one confirmation.
  A convenience that bundles two separate levers into one moment is welcome when it is
  visible and the user can change it there.
rejected:
  - >-
    neutral or conservative defaults by habit — every user then pays an extra step to do
    the usual thing
links:
  domain: eng
context:
  why: >-
    the common case should cost one confirmation, not an extra step every time to reach
    the usual choice
  src: adroit seed v1, distilled from StageDoor's ledger (eng:defaults-are-likely-usage)
