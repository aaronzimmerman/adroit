name: Modules reach by contract
decisions:
  - id: principle:modules-reach-by-contract
    decision: >-
      A module's entities never leak into another module's entities; the only cross-module reach is
      what the module's interface declares.
    rejected:
      - >-
        convenience joins across modules outside the declared interface — the monolithic-entity
        gravity this principle exists to resist: one container entity accreting every module's
        concepts, which takes a remodel to tease apart
  - id: principle:concept-lives-in-its-module
    decision: >-
      A concept lives only inside the module that owns it, and other modules neither hold it, serve
      by it, nor disclaim it.
    rejected:
      - >-
        defensive negative statements ("this module knows no X") — the mention is the leak: it
        imports the concept into a place that should have no word for it; the guard is stated once,
        here
context:
  why: >-
    de-skinned from a tool-entity ruling: a monolithic entity that accreted every module's concepts
    took a remodel to tease apart, so cross-module reach is by declared interface only
  src: adroit seed, distilled from StageDoor's ledger
