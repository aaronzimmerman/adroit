name: Counterexample before claim
decisions:
  - id: eng:counterexample-before-claim
    decision: >-
      An always/never claim about code is acted on only after a counterexample hunt over its call
      paths.
context:
  why: >-
    a constraint tightening based on "this is always set" broke call paths that omit the value by
    design — the claim had been verified at the wrong axis
  src: adroit seed v1, distilled from StageDoor's ledger (eng:counterexample-before-claim)
