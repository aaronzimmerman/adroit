name: Settings live in context
decisions:
  - id: principle:settings-live-in-context
    decision: >-
      Settings are concise and contextualized with the thing they control: inline when they are
      essential to the context or shape how it works, out of the way when they rarely change. Every
      screen keeps one focused purpose — never overloaded with contexts. Which settings screens
      exist, and what lands on which, is never a product ruling: the composition emerges from the
      relationships and the decisions — what needs configuring, how often it changes
      (matter-of-course vs set-once vs session-contextual), and what else the UI is doing. Records
      describe settings by FUNCTION, never by prescribing a named screen or tab.
    rejected:
      - >-
        prescribing the surface map in the ledger (a ruled setup-screen / settings-tab split) — the
        understanding evolves; some settings turn out matter-of-course, some set-once, some
        contextual, and a prescribed layout freezes a guess
context:
  why: >-
    which settings exist where should evolve from what needs configuring and what else the UI is
    doing, not from a frozen layout ruling
  src: adroit seed v1, distilled from StageDoor's ledger (principle:settings-live-in-context)
