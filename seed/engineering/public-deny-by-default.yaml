id: data:public-deny-by-default
name: Public deny by default
decision: >-
  Public serialization is deny-by-default for every model: a field is public only when explicitly
  marked so, and a build-time check fails on any unmarked publicly reachable field.
context: >-
  Inverting the serialization default makes an unclassified field go missing (a bug report) rather
  than leak (an incident).
