name: Frontend test harness
decisions:
  - id: eng:frontend-test-harness
    decision: >-
      The frontend has an automated test harness that runs in CI alongside the lint checks and the
      app builds.
context:
  why: >-
    frontend permission defects can ship past a fully green backend pipeline, each caught only by a
    human looking at a screenshot, when frontend decisions have no mechanical net
