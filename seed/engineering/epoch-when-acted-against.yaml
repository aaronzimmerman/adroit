id: eng:epoch-when-acted-against
name: Epoch when acted against
decision: >-
  Store a moment as an epoch when someone ACTS against it — a deadline that closes, a slot you are
  booked into — because two parties have to agree on the same instant and being hours out means one
  of them misses it. Store a plain date when the fact is a day on a calendar and being hours out
  changes nothing anyone does. A day with a wall-clock time that reads the same wherever it is read
  keeps its day and time as separate components. An epoch is converted to a zone only at the edge,
  where a person reads it, and the zone is named whenever it is not the reader's own.
context: >-
  The test is whether being wrong by a few hours would make someone miss something or double-book;
  reaching for epochs where nothing is acted against buys nothing and costs a time zone on every
  row.
