id: principle:model-mirrors-reality
decision: >-
  We model things as close to reality as they can be: entities follow the way the modeled
  domain actually thinks about them. When the domain sees ONE thing moving through
  several tools, the model holds one entity the contexts join from — never a per-tool
  remodeling of the same item. This won't always be possible or useful; where fidelity
  and utility conflict, the deviation is a deliberate, recorded choice, never a drift.
rejected:
  - >-
    per-tool copies of one real-world item as the default — several shapes of the same
    entity, each tool re-modeling the same attributes, kept aligned only by back-pointers
    and discipline
links: {}
context:
  why: >-
    when the fundamental entity isn't changing as it moves between tools, remodeling its
    attributes per tool multiplies shapes of the same thing that only discipline keeps
    aligned
  src: adroit seed v1, distilled from StageDoor's ledger (principle:model-mirrors-reality)
