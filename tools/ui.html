<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adroit — decision ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/ui/views.css">
<style>
:root{
  --paper:#FAF7F2; --surface:#FFFFFF; --surface2:#F3EEE6;
  --ink-text:#241F33; --muted:#6E6785; --faint:#A9A3BC;
  --line:#E2DCCF; --line2:#D4CDBD;
  --gold:#A8841C; --gold-soft:#F0E5C4;
  --violet:#6D4FC4; --violet-soft:#EAE4F8;
  --chip-bg:#EFEAE0; --sel:#241F33; --sel-text:#FAF7F2;
  --tension:#B94A4A;
  --amber:#B4820F; --amber-soft:#F6E7BE;
  --shadow:0 1px 2px rgba(36,31,51,.06); --lift:0 18px 50px rgba(36,31,51,.22);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F0D17; --surface:#181423; --surface2:#1F1A2E;
  --ink-text:#EDEAF6; --muted:#9C94B8; --faint:#645D80;
  --line:#2B2540; --line2:#37304F;
  --gold:#D9B24A; --gold-soft:#3A3116;
  --violet:#A78BFA; --violet-soft:#2B2347;
  --chip-bg:#241E38; --sel:#EDEAF6; --sel-text:#12101C;
  --tension:#E07A7A;
  --amber:#E7A92B; --amber-soft:#3D3112;
  --shadow:0 1px 2px rgba(0,0,0,.4); --lift:0 18px 50px rgba(0,0,0,.6);
} }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink-text);font-family:'Source Sans 3',system-ui,sans-serif;font-size:15.5px;line-height:1.5;margin:0;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;white-space:nowrap}
.brand .rule{color:var(--gold)}
.scope{display:flex;gap:2px;border:1px solid var(--line2);border-radius:3px;padding:2px;flex:none}
.scope button{font-size:13.5px;padding:4px 14px;border-radius:2px;color:var(--muted);white-space:nowrap}
.scope button:hover{color:var(--ink-text)}
.scope button.on{background:var(--sel);color:var(--sel-text)}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);white-space:nowrap}
.tag.err{color:var(--tension)}
.did{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;background:var(--chip-bg);border-radius:3px;padding:1px 7px}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
#problems{flex:none;border-bottom:1px solid var(--line);background:var(--amber-soft);padding:6px 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;max-height:120px;overflow-y:auto}
#problems[hidden]{display:none}
</style>

<header>
  <div class="brand">adroit <span class="rule">·</span> ledger</div>
  <div class="scope" id="modes" role="tablist" aria-label="View">
    <button data-mode="hierarchy">Hierarchy</button>
    <button data-mode="capabilities">Capabilities</button>
    <button data-mode="models">Views</button>
  </div>
  <span class="tag" id="counts"></span>
</header>
<div id="problems" hidden></div>
<div id="views"></div>

<script src="/ui/views.js"></script>
<script>
// The shell: a mode switcher over the three views in /ui/views.js, the store's counts, and the
// check's errors when there are any. The mode lives in the hash, so a view is a link.
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function route() {
  const want = location.hash.replace(/^#/, '');
  const mode = AdroitViews.has(want) ? want : 'hierarchy';
  document.querySelectorAll('#modes button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  AdroitViews.activate(mode, $('#views'));
}
$('#modes').addEventListener('click', (e) => {
  const b = e.target.closest('[data-mode]');
  if (b) location.hash = b.dataset.mode;
});
window.addEventListener('hashchange', route);

(async () => {
  const c = await (await fetch('/api/check')).json();
  const k = c.counts;
  $('#counts').textContent = `${k.decisions} decisions · ` +
    `${k.includes} includes · ${k.dubious} dubious · ${k.questions} questions` +
    (c.errors.length ? ` · ${c.errors.length} errors` : '');
  if (c.errors.length) {
    $('#counts').classList.add('err');
    $('#problems').hidden = false;
    $('#problems').innerHTML = c.errors.map((e) => `<div>${esc(e.id)} [${esc(e.rule)}] ${esc(e.message)}</div>`).join('');
  }
})();
route();
</script>
