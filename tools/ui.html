<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adroit — decision ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/ui/views.css">
<style>
:root{
  --paper:#FAF7F2; --surface:#FFFFFF; --surface2:#F3EEE6;
  --ink-text:#241F33; --muted:#6E6785; --faint:#A9A3BC;
  --line:#E2DCCF; --line2:#D4CDBD;
  --gold:#A8841C; --gold-soft:#F0E5C4;
  --violet:#6D4FC4; --violet-soft:#EAE4F8;
  --chip-bg:#EFEAE0; --sel:#241F33; --sel-text:#FAF7F2;
  --tension:#B94A4A;
  /* the ONE anomaly colour: adrift records, gap ghosts and suggestion endpoints all wear it, at
     every altitude, so "something is wrong here" is a single thing to learn to see */
  --amber:#B4820F; --amber-soft:#F6E7BE;
  --shadow:0 1px 2px rgba(36,31,51,.06); --lift:0 18px 50px rgba(36,31,51,.22);
  --scrim:rgba(36,31,51,.42);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F0D17; --surface:#181423; --surface2:#1F1A2E;
  --ink-text:#EDEAF6; --muted:#9C94B8; --faint:#645D80;
  --line:#2B2540; --line2:#37304F;
  --gold:#D9B24A; --gold-soft:#3A3116;
  --violet:#A78BFA; --violet-soft:#2B2347;
  --chip-bg:#241E38; --sel:#EDEAF6; --sel-text:#12101C;
  --tension:#E07A7A;
  --amber:#E7A92B; --amber-soft:#3D3112;
  --shadow:0 1px 2px rgba(0,0,0,.4); --lift:0 18px 50px rgba(0,0,0,.6);
  --scrim:rgba(6,5,11,.62);
} }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink-text);font-family:'Source Sans 3',system-ui,sans-serif;font-size:15.5px;line-height:1.5;margin:0;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}

/* ---- the only chrome: a scope choice and a search bar ---- */
header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line);flex:none}
.brand{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;white-space:nowrap}
.brand .rule{color:var(--gold)}
.scope{display:flex;gap:2px;border:1px solid var(--line2);border-radius:3px;padding:2px;flex:none}
.scope button{font-size:13.5px;padding:4px 14px;border-radius:2px;color:var(--muted);white-space:nowrap}
.scope button:hover{color:var(--ink-text)}
.scope button.on{background:var(--sel);color:var(--sel-text)}
.finder{flex:1;min-width:200px;max-width:640px;position:relative}
.finder input{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:3px;color:var(--ink-text);padding:8px 13px;font:inherit;font-size:14px}
.finder input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.hits{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--surface);border:1px solid var(--line2);border-radius:3px;box-shadow:var(--lift);max-height:340px;overflow-y:auto;z-index:30}
.hits button{display:block;width:100%;padding:7px 12px;border-bottom:1px solid var(--line)}
.hits button:last-child{border-bottom:0}
.hits button:hover,.hits button.cur{background:var(--surface2)}
.hits .g{font-weight:600;font-size:14px}
.hits .m{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);margin-left:7px}
.hits .s{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);white-space:nowrap;flex:none}

/* ---- the graph is the page ---- */
#gwrap{position:relative;flex:1;min-height:0}
#gcanvas{display:block;width:100%;height:100%;cursor:default}
.gtip{position:absolute;pointer-events:none;background:var(--surface2);border:1px solid var(--line2);border-radius:3px;padding:6px 9px;font-size:12.5px;max-width:330px;box-shadow:var(--shadow);z-index:3}
.gtip b{font-family:'IBM Plex Mono',monospace;font-size:11px}
.legend{position:absolute;left:14px;bottom:12px;display:flex;gap:13px;flex-wrap:wrap;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);background:color-mix(in srgb, var(--paper) 80%, transparent);padding:5px 9px;border-radius:3px;pointer-events:none}
.legend i{width:18px;height:0;border-top-width:2px;border-top-style:solid;display:inline-block;vertical-align:middle;margin-right:4px}
.tools{position:absolute;right:14px;bottom:12px;display:flex;gap:6px}
.tools button{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:3px 9px;background:var(--paper)}
.tools button:hover{color:var(--ink-text);border-color:var(--gold)}

/* ---- detail overlay ---- */
#ovl{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:26px;z-index:50}
#ovl[hidden]{display:none}
.obox{background:var(--surface);border:1px solid var(--line2);border-radius:4px;box-shadow:var(--lift);max-width:720px;width:100%;max-height:86vh;overflow-y:auto;padding:20px 24px}
.obox .otop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.obox .oclose{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:2px 8px}
.obox .oclose:hover{border-color:var(--gold);color:var(--ink-text)}
.did{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;background:var(--chip-bg);border-radius:3px;padding:1px 7px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;border-radius:3px;padding:1px 6px}
.badge.prov{color:var(--muted);border:1px dashed var(--line2)}
.badge.pilot{color:var(--sel-text);background:var(--gold)}
.badge.tension{color:var(--tension);border:1px solid var(--tension)}
.badge.flat{color:var(--muted);border:1px dashed var(--line2)}
.badge.kind{color:var(--violet);border:1px solid var(--violet);letter-spacing:.12em}
.ogist{font-family:Fraunces,Georgia,serif;font-size:25px;font-weight:600;margin:0 0 4px}
.stmt{margin:0;max-width:72ch;font-size:16px}
.dsec{margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
.dsec>h4{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 8px}
.dsec.core>h4{color:var(--gold)}
.rej{margin:0;padding-left:17px;font-size:14px}
.rej li{margin-bottom:4px}
.none{font-size:13px;color:var(--muted);border-left:2px solid var(--line2);padding-left:9px;font-style:italic;margin:0}
.ctx{font-size:14px;color:var(--muted);border-left:2px solid var(--gold);padding-left:11px;font-style:italic;margin:0}
.ctx .src{display:block;font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:5px;color:var(--faint)}
.fileline{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);margin-top:10px}
.dmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.edge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;border-radius:3px;padding:2px 8px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
button.edge:hover{border-color:var(--gold);color:var(--ink-text)}
.edge.refines{border-color:var(--violet);color:var(--violet)}
.edge.grounds{border:none;background:var(--violet-soft);color:var(--violet)}
.edge.consumes{border-color:var(--gold);color:var(--gold)}
.edge.tension{border-color:var(--tension);color:var(--tension)}
.edge.inb{border-style:dashed}
.edge.off{opacity:.55;font-style:italic}
.ixnitem{font-size:13.5px;display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--line2);padding-left:10px;margin-bottom:9px}
.ixnitem .k{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em}
.ixnitem .k.resolved-fork{color:var(--violet)} .ixnitem .k.prevented{color:var(--gold)} .ixnitem .k.gap{color:var(--tension)}
.ixnitem .w{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint)}
.kept{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--gold);border:1px solid var(--gold);border-radius:3px;padding:1px 6px}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

/* ---- root-story chips: WHICH PRODUCT a system serves ---- */
.roots{display:flex;gap:2px;border:1px solid var(--line2);border-radius:3px;padding:2px;flex:none}
.roots[hidden]{display:none}
.roots button{font-size:12.5px;padding:4px 10px;border-radius:2px;color:var(--faint);white-space:nowrap;border:1px solid transparent}
.roots button:hover{color:var(--ink-text)}
.roots button.on{color:var(--ink-text);border-color:var(--gold);background:var(--gold-soft)}
.roots button .n{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.65;margin-left:5px}

/* ---- the stage: canvas + incoherence rail ---- */
#stage{display:flex;flex:1;min-height:0}
#rail{width:336px;flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
#rail.shut{width:38px}
#rail.shut .rbody,#rail.shut .rhead .rtitle{display:none}
.rhead{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);flex:none}
.rhead .rtitle{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:15px}
.rhead .rcount{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--sel-text);background:var(--amber,#B4820F);border-radius:8px;padding:1px 7px}
#rail.shut .rhead{flex-direction:column;padding:9px 4px}
.rtoggle{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:2px 7px;margin-left:auto}
#rail.shut .rtoggle{margin:0 0 8px}
.rtoggle:hover{border-color:var(--gold);color:var(--ink-text)}
.rbody{overflow-y:auto;padding:4px 0 26px;flex:1;min-height:0}
.rsec{border-bottom:1px solid var(--line)}
.rsec>h5{display:flex;align-items:center;gap:7px;margin:0;padding:9px 12px 5px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
.rsec>h5 .c{margin-left:auto;color:var(--faint)}
.rsec p.why{margin:0 12px 8px;font-size:11.5px;color:var(--faint);font-style:italic;line-height:1.35}
.rent{display:block;width:100%;padding:7px 12px;border-left:3px solid transparent;font-size:13px}
.rent:hover{background:var(--surface2);border-left-color:var(--gold)}
.rent .t{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;display:block}
.rent .d{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.rent.k-adrift{border-left-color:color-mix(in srgb,#B4820F 55%,transparent)}
.rent.k-gap{border-left-color:var(--tension)}
.rent.k-crossing{border-left-color:var(--tension)}
.rent.k-suggestion{border-left-color:var(--violet-soft)}
.rempty{padding:10px 12px;font-size:12.5px;color:var(--muted);font-style:italic}

/* ---- focus mode ---- */
.focusbar{position:absolute;left:50%;transform:translateX(-50%);top:12px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--gold);border-radius:3px;padding:5px 9px;box-shadow:var(--shadow);font-size:13px;z-index:4}
.focusbar[hidden]{display:none}
.focusbar b{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500}
.focusbar .x{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:0 7px}
.focusbar .x:hover{border-color:var(--gold);color:var(--ink-text)}
.focusbar .hint{font-size:11.5px;color:var(--faint)}
.obox .oact{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:2px 8px}
.obox .oact:hover{border-color:var(--gold);color:var(--ink-text)}
@media (max-width:760px){ header{flex-wrap:wrap} .finder{order:3;max-width:none;flex-basis:100%} #rail{width:38px} #rail:not(.shut){position:absolute;right:0;top:0;bottom:0;width:300px;z-index:6} }
</style>

<header>
  <div class="brand">adroit <span class="rule">·</span> ledger</div>
  <div class="scope" id="modes" role="tablist" aria-label="View">
    <button data-mode="galaxy" class="on">Galaxy</button>
    <button data-mode="hierarchy">Hierarchy</button>

  </div>
  <div class="scope" id="scope-tabs" role="tablist">

</header>

<div id="views" hidden></div>

<div id="stage">
  <div id="gwrap">
    <canvas id="gcanvas"></canvas>
    <div class="gtip" id="gtip" hidden></div>
    <div class="focusbar" id="focusbar" hidden></div>
    <div class="legend" id="legend"></div>
    <div class="tools"><button id="g-fit">Fit</button><button id="g-reheat">Re-run layout</button></div>
  </div>
  <aside id="rail" class="shut" aria-label="Incoherence">
    <div class="rhead">
      <button class="rtoggle" id="r-toggle" title="Incoherence rail">☰</button>

</div>

<div id="ovl" hidden><div class="obox" role="dialog" aria-modal="true" id="obox"></div></div>

<!-- The three walked views, loaded FIRST: the shell asks `AdroitViews.has(mode)` while it routes,
     so the answer has to exist before the first route is taken. -->
<script src="/ui/views.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const trunc = (s,n) => s.length > n ? s.slice(0,n-1).trimEnd()+'…' : s;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();

let SCOPE = 'product';
// THE MODE: which view is on screen. The galaxy is one of four and keeps every behaviour it had;
// the other three live in /ui/views.js and are handed the `#views` host to render into. The galaxy
// owns the canvas, the simulation and the camera, so switching away PAUSES it rather than tearing
// it down — coming back finds the same picture.
let MODE = 'galaxy';
const isGalaxy = () => MODE === 'galaxy';
document.body.dataset.mode = MODE;    // stamped before first paint, or the galaxy flashes hidden
let GD = null;                 // the scoped graph as served
let ALL = null;                // every record, for overlay content and off-graph link chips
let IXN = {};                  // interaction events by decision id
let SIM = null, GRAF = 0, HOVER = null, sel = null;
let VIEW = { k: 1, x: 0, y: 0 };
let MATCH = null;              // ids matching the current search, or null
let mods = {}, MODMETA = {};
// A tree path (`capabilities/email`, `product/hq`, `engineering`) → the cloud it draws as. The
// store's rule, restated here only because the crossing list carries raw tree paths.
const cloudOfTree = t => (t && t.includes('/') ? t.slice(t.indexOf('/') + 1) : (t ?? '—'));
// ---- the three views onto WHERE THE INCOHERENCE IS ----
// ROOTS: which product stories are on screen (empty = all). FOCUS: one node and the frontier grown
// around it. INC: the store's own complaint list, served whole from /api/incoherence — every
// finding here was computed in lib.mjs; the canvas places and colours them and decides nothing.
let ROOTS = new Set();
let FOCUS = null;              // {root, frontier:Set<id>, saved:{view, roots, lock}}
let INC = null, ANOM = {}, GHOSTS = [], GHOSTPOS = new Map();
let PULSE = null;              // {ids:Set, bodies:Set, t0}
let RAIL_OPEN = false;
// The UI RENDERS what the store says and never decides it: `kind` and `moduleScoped` arrive on
// every record from the API. A second copy of the namespace rule here is the exact defect
// eng:namespace-names-kind was written about, and it had already appeared once in badges().

const byId = {};
const refines = d => d.links?.refines;
const grounds = d => d.links?.grounds ?? [];
const consumes = d => d.links?.consumes ?? [];
const tensions = d => [].concat(d.links?.tension ?? []);
const domains = d => [].concat(d.links?.domain ?? []);

// ============================================================ physics
// Velocity Verlet: link springs by edge type, short-range repulsion, a moderate pull toward each
// module's OWN EMERGENT CENTROID (where the module has drifted to, never an assigned seat), and
// a whisper of centering. Nothing is positioned by decree; the clusters are still the graph's.
const REPULSION = 260, DAMPING = 0.82, CUTOFF2 = 420*420, MAX_REPULSE = 5, MAX_V = 22;
const MODULE_GRAVITY = 0.034, CENTERING = 0.00022;
// Islands need water between them. Node-node repulsion alone cannot make it: it is local and
// capped, so two clouds settle shoulder to shoulder and interpenetrate. A force between module
// CENTROIDS pushes whole neighbourhoods apart, and every member feels it, so the cluster moves
// as one body instead of being torn.
const CLUSTER_REPULSION = 1100000, CLUSTER_GAP = 2600, MAX_CLUSTER_PUSH = 11;
// A tree has a core and a rim, for the same reason a tree has internal and shared records.
// A decision every one of whose links stays inside its module is INTERNAL — it binds tight to the
// middle. A decision with any link out is BOUNDARY — it belongs on the rim, facing whatever it
// talks to, exactly as the shared models already do at macro altitude. And gravity is MASS:
// scaled by how many intra-module links a node has, so a well-connected member is held hard and
// an adrift one (no intra links at all) floats loose off the edge — the incoherence warning made
// visible as physics rather than as a line of text.
// The core and rim targets are fractions of the module's OWN mean radius, measured every tick.
// A fixed distance cannot work: the whole layout rescales when the separation forces change, and
// a rim constant that was right at one scale silently stops biting at another.
const CORE_TARGET = 0.40, RIM_TARGET = 1.5, ADRIFT_TARGET = 2.1, CORE_TIGHTEN = 0.62;
// The radial pull needs its own, much stronger constant: at MODULE_GRAVITY the link springs simply
// overwhelmed it and core and rim came out at the same radius (measured 211 vs 208).
const RADIAL_GRAVITY = 0.115;
const MASS_BASE = 0.30, MASS_PER = 0.34, MASS_MAX = 2.1;
// Rest lengths: longer overall so clusters breathe, much SHORTER for a leaf, so a decision that
// only refines its parent tucks in tight against it instead of floating out into the channel.
const LINK_SCALE = 1.55, LEAF_SCALE = 0.42;

function makeSim(gd, w, h){
  const R = Math.min(w,h) * 0.42;
  const nodes = gd.nodes.map(n => {
    const a = Math.random()*Math.PI*2, r = Math.sqrt(Math.random())*R;
    return {...n, x: w/2+Math.cos(a)*r, y: h/2+Math.sin(a)*r, vx:0, vy:0, pinned:false};
  });
  const index = new Map(nodes.map((n,i)=>[n.id,i]));
  const edges = gd.edges.map(e=>({...e, s:index.get(e.source), t:index.get(e.target)}))
    .filter(e=>e.s!==undefined && e.t!==undefined);
  const adj = nodes.map(()=>new Set());
  for (const e of edges){ adj[e.s].add(e.t); adj[e.t].add(e.s); }
  // Core / boundary, and the mass that comes with connectivity. Both are read off the edges, so
  // they change when the ledger changes rather than being anybody's opinion.
  nodes.forEach((n,i) => { n.intraDeg = 0; n.crossDeg = 0; });
  for (const e of edges){
    const A = nodes[e.s], B = nodes[e.t];
    if (A.module === B.module && A.module){ A.intraDeg++; B.intraDeg++; }
    else { A.crossDeg++; B.crossDeg++; }
  }
  for (const im of gd.imports || []){
    const i = index.get(im.model);
    if (i !== undefined) nodes[i].crossDeg++;     // an import is a link out by definition
  }
  const memberCount = new Map();
  for (const n of nodes) if (n.module) memberCount.set(n.module, (memberCount.get(n.module) ?? 0) + 1);
  for (const n of nodes){
    n.boundary = n.crossDeg > 0;
    n.mass = Math.min(MASS_MAX, MASS_BASE + MASS_PER * n.intraDeg);
    n.members = memberCount.get(n.module) ?? 1;   // used by diveInto to frame the system
  }

  // Rest length is decided once per edge: a leaf (one connection) is pulled right in against its
  // parent, a link between two core members is pulled tighter still, everything else gets room.
  for (const e of edges){
    const base = (GD.physics[e.type] ?? GD.physics.grounds).length;
    const leaf = adj[e.s].size === 1 || adj[e.t].size === 1;
    const bothCore = !nodes[e.s].boundary && !nodes[e.t].boundary;
    e.rest = base * (leaf ? LEAF_SCALE : LINK_SCALE) * (bothCore ? CORE_TIGHTEN : 1);
  }
  // A module IMPORTING a model is an edge with no second node — its far end is the whole cloud.
  // Kept apart from `edges` for that reason, and sprung against the cloud's centroid in tick().
  const imports = (gd.imports||[]).map(im=>({...im, i:index.get(im.model)})).filter(im=>im.i!==undefined);
  return {nodes, edges, imports, index, adj, cen:new Map(), alpha:1, w, h};
}

// A node that is filtered out (a root chip turned off, or outside the focus frontier) is `off`:
// absent from every force, not merely undrawn. That is what "the physics re-settles on the visible
// subset" means — the survivors lay themselves out as if the hidden ones were never there. With
// nothing hidden every loop below is exactly the loop it was, so the constants are untouched.
function tick(sim){
  const {nodes, edges, alpha:a, w, h} = sim;
  for (let i=0;i<nodes.length;i++){
    const ni = nodes[i];
    if (ni.off) continue;
    for (let j=i+1;j<nodes.length;j++){
      const nj = nodes[j];
      if (nj.off) continue;
      let dx=nj.x-ni.x, dy=nj.y-ni.y, d2=dx*dx+dy*dy;
      if (d2 > CUTOFF2) continue;
      if (d2 < 0.01){ dx=Math.random()-0.5; dy=Math.random()-0.5; d2=dx*dx+dy*dy; }
      const d = Math.sqrt(d2);
      const f = Math.min(MAX_REPULSE, (REPULSION*(ni.radius+nj.radius))/Math.max(d2,64)) * a;
      const fx=(dx/d)*f, fy=(dy/d)*f;
      ni.vx-=fx; ni.vy-=fy; nj.vx+=fx; nj.vy+=fy;
    }
  }
  for (const e of edges){
    const ph = GD.physics[e.type] ?? GD.physics.grounds;
    const A = nodes[e.s], B = nodes[e.t];
    if (A.off || B.off) continue;
    const dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||0.01;
    const f = ((d-e.rest)/d) * ph.strength * 0.1 * a;
    A.vx+=dx*f; A.vy+=dy*f; B.vx-=dx*f; B.vy-=dy*f;
  }
  // Emergent module centroids, recomputed every tick: the target is wherever the module has got
  // to on its own, so cohesion is a pull TOGETHER rather than a pull toward a chosen spot.
  // A cloud is where its DECISIONS are. A model is drawn inside that cloud but never helps define
  // it: counted in, a model pulled outward by its importers would drag the whole cloud after it and
  // the boundary could never show. Excluded, the owner's pull is fixed and the importers' pull is
  // what moves the model — which is the entire mechanism.
  const cen = new Map();
  for (const n of nodes){
    if (!n.module || n.kind === 'model' || n.off) continue;
    const c = cen.get(n.module) ?? {x:0,y:0,n:0};
    c.x+=n.x; c.y+=n.y; c.n++; cen.set(n.module, c);
  }
  for (const c of cen.values()){ c.x/=c.n; c.y/=c.n; }
  // ...and how far its members typically sit from it, which is what core and rim are measured in.
  for (const n of nodes){
    if (!n.module || n.kind === 'model' || n.off) continue;
    const c = cen.get(n.module); if (!c) continue;
    c.r = (c.r ?? 0) + Math.hypot(n.x-c.x, n.y-c.y);
  }
  for (const c of cen.values()) c.r = Math.max(20, (c.r ?? 0) / c.n);
  sim.cen = cen;
  // Read pull: each reading tree tugs the model toward its own cloud. A model read by
  // several trees is therefore dragged off the models root's middle and comes to rest on the rim
  // facing them — the boundary revealing itself instead of being drawn by hand.
  const ip = GD.importPhysics;
  for (const im of sim.imports){
    const c = cen.get(im.module); if (!c) continue;
    const n = nodes[im.i];
    if (n.off) continue;
    const dx=c.x-n.x, dy=c.y-n.y, d=Math.hypot(dx,dy)||0.01;
    const f = ((d-ip.length)/d) * ip.strength * 0.1 * a;
    n.vx += dx*f; n.vy += dy*f;
  }
  // Centroid-vs-centroid repulsion: whole clouds shoving each other apart until there is water
  // between them. The push is handed to every member so the island drifts intact.
  const push = new Map();
  const cs = [...cen];
  for (let i=0;i<cs.length;i++){
    for (let j=i+1;j<cs.length;j++){
      const [ma,ca]=cs[i], [mb,cb]=cs[j];
      let dx=cb.x-ca.x, dy=cb.y-ca.y, d=Math.hypot(dx,dy);
      if (d > CLUSTER_GAP) continue;
      if (d < 0.01){ dx=Math.random()-0.5; dy=Math.random()-0.5; d=Math.hypot(dx,dy); }
      const f = Math.min(MAX_CLUSTER_PUSH, CLUSTER_REPULSION/Math.max(d*d, 400)) * a;
      const fx=(dx/d)*f, fy=(dy/d)*f;
      const pa = push.get(ma) ?? {x:0,y:0}; pa.x-=fx; pa.y-=fy; push.set(ma,pa);
      const pb = push.get(mb) ?? {x:0,y:0}; pb.x+=fx; pb.y+=fy; push.set(mb,pb);
    }
  }
  // Where each boundary node WANTS to sit on the rim: in the direction of the things it talks to.
  // Accumulated from the live positions, so a decision that reaches into two systems settles
  // between them and one that reaches into a single system points straight at it.
  const outward = new Map();
  const acc = (i, px, py) => {
    const o = outward.get(i) ?? {x:0,y:0,n:0};
    o.x += px; o.y += py; o.n++; outward.set(i, o);
  };
  for (const e of edges){
    const A = nodes[e.s], B = nodes[e.t];
    if (A.module === B.module || A.off || B.off) continue;
    acc(e.s, B.x, B.y); acc(e.t, A.x, A.y);
  }
  for (const im of sim.imports){
    const c2 = cen.get(im.module);
    if (c2 && !nodes[im.i].off) acc(im.i, c2.x, c2.y);
  }

  for (let ni = 0; ni < nodes.length; ni++){
    const n = nodes[ni];
    if (n.off){ n.vx=n.vy=0; continue; }
    if (n.pinned){ n.vx=n.vy=0; continue; }
    const c = cen.get(n.module);
    if (c){
      // Core nodes target the middle; boundary nodes target a point on the rim facing their
      // foreign links. The pull is scaled by mass, so an adrift member barely feels it.
      // An ADRIFT member — nothing inside its own module links to it — is given the outermost
      // orbit of all, so the coherence warning is something you SEE rather than read.
      const band = n.intraDeg === 0 ? ADRIFT_TARGET : n.boundary ? RIM_TARGET : CORE_TARGET;
      const target = band * c.r;
      let dx, dy;
      const o = n.boundary ? outward.get(ni) : null;
      if (o){ dx = o.x/o.n - c.x; dy = o.y/o.n - c.y; }
      else { dx = n.x - c.x; dy = n.y - c.y; }
      const d = Math.hypot(dx,dy) || 1;
      const tx = c.x + dx/d*target, ty = c.y + dy/d*target;
      n.vx += (tx-n.x)*RADIAL_GRAVITY*n.mass*a;
      n.vy += (ty-n.y)*RADIAL_GRAVITY*n.mass*a;
    }
    const p = push.get(n.module);
    if (p){ n.vx += p.x; n.vy += p.y; }
    n.vx += (w/2-n.x)*CENTERING*a;
    n.vy += (h/2-n.y)*CENTERING*a;
    n.vx = Math.max(-MAX_V, Math.min(MAX_V, n.vx*DAMPING));
    n.vy = Math.max(-MAX_V, Math.min(MAX_V, n.vy*DAMPING));
    n.x += n.vx; n.y += n.vy;
  }
  sim.alpha += (0 - sim.alpha) * 0.023;
}

// ============================================================ rendering
// ---- semantic zoom -------------------------------------------------------------------------
// The complaint was "hard to parse", and the cause is that everything is drawn at full strength
// at every zoom. Three rules answer it, all keyed on SCREEN measurements so they respond to the
// zoom rather than to the data:
//
//   1. an edge fades with its screen LENGTH — the short intra-cluster wiring that gives a
//      neighbourhood its shape stays visible; the long cross-canvas lines that make the yarn ball
//      drop to a hint. They are exactly the edges hover brings back at full strength, so nothing
//      is lost, only deferred until asked for.
//   2. grounds edges vanish below a zoom threshold: they are citations, the least structural
//      thing on the canvas, and there are hundreds of them.
//   3. labels get a BUDGET that grows with zoom, so the overview names the landmarks and detail
//      zoom returns to naming everything that fits.
const EDGE_MIN_ALPHA = 0.05, GROUNDS_ZOOM = 1.15;
const CROSS_FULL_ZOOM = 1.5;
// What makes the yarn ball is not LENGTH, it is CROSSING. Two length rules were tried and both
// measured out wrong: screen pixels (zoomed to fit everything is short, 632 of 671 edges came back
// at full strength) and world length against the median (the distribution is too flat to
// discriminate, 658 of 671). The edges that tangle the picture are the ones running BETWEEN
// modules, and that is a fact about the graph rather than a proxy for it — so ask it directly.
const crosses = (a, b) => (a.module ?? a.id) !== (b.module ?? b.id);
const CROSS_CEILING = 0.55, SPAN_LIMIT = 0.5, SPAN_FLOOR = 0.1;
let VIEW_SPAN = 800;
/** Two signals, and both are needed. CROSSING says which edges tangle the picture; it alone was
 *  not enough, because at detail zoom the cross edges returned to full strength and the spaghetti
 *  with them. SCREEN REACH says which edges run clean off the view, and it alone was not enough
 *  either, because zoomed out to fit every edge is short in pixels. Together: cluster wiring is
 *  always solid, crossings are a hint that firms up as you close in but never shouts, and anything
 *  spanning the viewport steps back at any zoom. Hover overrides both — that is where a
 *  cross-module edge is actually read. */
function edgeFade(A, B, focused){
  if (focused) return 1;
  let f = 1;
  if (crosses(A, B)){
    const t = Math.max(0, Math.min(1, (VIEW.k - 0.55) / (CROSS_FULL_ZOOM - 0.55)));
    f = EDGE_MIN_ALPHA + t*t * (CROSS_CEILING - EDGE_MIN_ALPHA);
  }
  const reach = Math.hypot(A.x-B.x, A.y-B.y) * VIEW.k / (VIEW_SPAN * SPAN_LIMIT);
  if (reach > 1) f *= Math.max(SPAN_FLOOR, 2 - reach);
  return f;
}
/** How many DECISION labels the view can carry. Kinds (story, model, principle) are landmarks and
 *  are always named; this budget is what keeps the rest from becoming a smear. */
function labelBudget(k){
  if (k >= 2.1) return Infinity;            // detail zoom: collision culling alone, as before
  return Math.max(18, Math.round(26 * Math.pow(k / 0.8, 2.4)));
}

const EDGE_STYLE = {
  refines:  {color:'violet',  width:1.1, dash:null,  alpha:0.75},
  grounds:  {color:'faint',   width:0.6, dash:null,  alpha:0.18},
  consumes: {color:'gold',    width:1.2, dash:null,  alpha:0.85},
  tension:  {color:'tension', width:1.2, dash:[4,3], alpha:0.9},
};

/** Convex hull (monotone chain) of a module's own decisions — the silhouette of an island. */
function hullOf(pts){
  if (pts.length < 3) return pts;
  const p = [...pts].sort((a,b)=>a.x-b.x || a.y-b.y);
  const cross = (o,a,b) => (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x);
  const half = (src) => {
    const h = [];
    for (const q of src){ while (h.length>=2 && cross(h[h.length-2],h[h.length-1],q) <= 0) h.pop(); h.push(q); }
    h.pop(); return h;
  };
  return [...half(p), ...half([...p].reverse())];
}

/** A barely-there tint under each module, fading out as you zoom in. At overview it gives the
 *  neighbourhoods a silhouette — you can see WHERE a module is without reading a single label —
 *  and by detail zoom it is gone, because up close the nodes say it themselves. A tint, never a
 *  border: a drawn boundary would claim a precision the layout does not have. */
let HULLS = true;

// ============================================================ level of detail
// A STAR MAP first. Zoomed out, 470 dots say nothing; what you want to see is the systems and the
// traffic between them. So below a zoom threshold each module collapses into one body at its own
// cluster centroid, every edge between two systems aggregates into one band, and the decisions
// themselves are not drawn at all. Zooming in crossfades the bodies away and the planets appear.
// This is a RENDER layer over the same simulation — there is one layout, seen at two altitudes.
const MACRO_FULL = 0.55, MICRO_FULL = 0.95;
// Once the camera is INSIDE a system — most of what is on screen belongs to one module — the
// foreign planets still in frame are sky, not neighbours. Dimming them says which system you are
// standing in without drawing a boundary or hiding anything.
const FOCUS_SHARE = 0.18, FOCUS_LEAD = 1.2, FOCUS_HOLD = 0.10, FOCUS_DIM = 0.2;
let FOCUS_MODULE = null, FOCUS_LOCK = null;
let PRINCIPLE_CONSTELLATION = false;   // one gold sun, or the 8 as a tight named constellation
let MACRO = null, HOVER_BODY = null;
// The pending single-click that opens an overlay, held so a double-click can cancel it — and so
// can anything else that moves the view out from under it.
let CLICK_T = 0;

/** 1 = pure star map, 0 = pure detail, between = the crossfade. */
function macroMix(){
  if (VIEW.k <= MACRO_FULL) return 1;
  if (VIEW.k >= MICRO_FULL) return 0;
  return (MICRO_FULL - VIEW.k) / (MICRO_FULL - MACRO_FULL);
}

/** Which body a node belongs to when the map is zoomed out. Stories are SUNS — they keep their own
 *  identity rather than dissolving into a module, because a story is the sentence a whole branch
 *  answers to, not a member of a neighbourhood. */
function systemKeyOf(n){
  if (n.kind === 'story') return 'story:' + n.id;
  if (n.kind === 'principle' && PRINCIPLE_CONSTELLATION) return 'principle:' + n.id;
  return 'mod:' + (n.module ?? '—');
}

/** Bodies and bands, aggregated from the live layout every draw. Nothing is stored and no second
 *  simulation runs: a body sits at the centroid of its own members, so it moves with them. */
function buildMacro(sim){
  const bodies = new Map();
  for (const n of sim.nodes){
    if (n.off) continue;            // a filtered system has no body: that is what hiding it means
    // A SHARED model is drawn as a satellite on the models root's rim, so a fact more than one
    // tree reads says so at a glance. A single-consumer model is absorbed into the body.
    if ((n.kind === 'model' || n.kind === 'view') && n.shared) continue;
    const key = systemKeyOf(n);
    const b = bodies.get(key) ?? { key, kind: n.kind === 'story' ? 'story' : 'module',
      module: n.module, x:0, y:0, n:0, inbound:0, members:[] };
    b.x += n.x; b.y += n.y; b.n++; b.inbound += n.inbound; b.members.push(n);
    bodies.set(key, b);
  }
  for (const b of bodies.values()){
    b.x /= b.n; b.y /= b.n;
    b.anomalies = INC ? (b.kind === 'story' ? 0 : (INC.byModule[b.module] ?? 0)) : 0;
    b.dim = b.members.every(n => n.dim);
    // Sized by MEMBER COUNT, not aggregate inbound: at this altitude the question is how big a
    // region is, and inbound already does its work one level down as node radius (eng:prominence-follows-dependence).
    // The size is in SCREEN pixels, not world units — a star map's bodies are a fixed vocabulary
    // of sizes you read against each other, and world-sized ones shrank to specks at fit.
    b.screenR = b.kind === 'story' ? 13 : 9 + 2.6 * Math.sqrt(b.n);
    b.label = b.kind === 'story' ? b.members[0].gist : (b.module ?? '—');
    b.accent = b.kind === 'story' ? cssVar('violet') : (mods[b.module]?.accent || cssVar('faint'));
    b.purpose = b.kind === 'story' ? b.members[0].decision
      : (MODMETA[b.module]?.purpose || MODMETA[b.module]?.blurb || '');
  }
  const keyOf = new Map(sim.nodes.map(n => [n.id, n.off ? null : systemKeyOf(n)]));
  const satellites = sim.nodes.filter(n => (n.kind === 'model' || n.kind === 'view') && n.shared && !n.off)
    .map(n => ({ n, body: bodies.get('mod:' + (n.module ?? '—')) })).filter(s => s.body);

  const bands = new Map();
  const add = (ka, kb, type) => {
    if (!ka || !kb || ka === kb) return;
    const id = ka < kb ? ka + '\u0001' + kb : kb + '\u0001' + ka;
    const band = bands.get(id) ?? { a: ka < kb ? ka : kb, b: ka < kb ? kb : ka, n:0, consumes:0, other:0 };
    band.n++; type === 'consumes' ? band.consumes++ : band.other++;
    bands.set(id, band);
  };
  for (const e of sim.edges) add(keyOf.get(sim.nodes[e.s].id), keyOf.get(sim.nodes[e.t].id), e.type);
  for (const im of sim.imports) add(keyOf.get(sim.nodes[im.i].id), 'mod:' + im.module, 'consumes');
  for (const band of bands.values()){
    band.A = bodies.get(band.a); band.B = bodies.get(band.b);
    band.gold = band.consumes > band.other;      // a band is gold when the traffic is consumption
  }
  // A CROSSING: an edge the one-way direction rule forbids. Drawn between the two trees it
  // actually runs between, so a reference that should not exist reads as what it is: traffic
  // with no road.
  const seamLines = [];
  for (const s of (INC?.crossings ?? [])){
    const A = bodies.get('mod:' + cloudOfTree(s.from)), B = bodies.get('mod:' + cloudOfTree(s.to));
    if (A && B && A !== B) seamLines.push({ A, B, s });
  }
  return { bodies, bands: [...bands.values()].filter(b => b.A && b.B), satellites, seamLines };
}

function drawMacro(ctx, mix){
  const { bodies, bands, satellites } = MACRO;
  const hoodKeys = HOVER_BODY
    ? new Set([HOVER_BODY, ...bands.filter(b=>b.a===HOVER_BODY||b.b===HOVER_BODY).flatMap(b=>[b.a,b.b])])
    : null;
  const litKey = k => !hoodKeys || hoodKeys.has(k);

  for (const band of bands){
    const on = litKey(band.a) && litKey(band.b);
    ctx.globalAlpha = mix * (on ? Math.min(0.75, 0.16 + band.n*0.05) : 0.03);
    ctx.strokeStyle = band.gold ? cssVar('gold') : cssVar('violet');
    ctx.lineWidth = (0.8 + 1.5*Math.sqrt(band.n)) / VIEW.k;   // one confident band, not N threads
    ctx.beginPath(); ctx.moveTo(band.A.x, band.A.y); ctx.lineTo(band.B.x, band.B.y); ctx.stroke();
  }
  for (const s of satellites){
    const b = s.body;
    const dx = s.n.x-b.x, dy = s.n.y-b.y, d = Math.hypot(dx,dy) || 1;
    const rr = (b.screenR + 8)/VIEW.k;
    const x = b.x + dx/d*rr, y = b.y + dy/d*rr, sz = 4/VIEW.k;
    ctx.globalAlpha = mix * (litKey(b.key) ? 0.9 : 0.12);
    ctx.beginPath();
    ctx.moveTo(x, y-sz); ctx.lineTo(x+sz, y); ctx.lineTo(x, y+sz); ctx.lineTo(x-sz, y); ctx.closePath();
    ctx.fillStyle = cssVar('violet-soft'); ctx.fill();
    ctx.lineWidth = 1.1/VIEW.k; ctx.strokeStyle = cssVar('gold'); ctx.stroke();
  }
  // Crossings, over the bands: the same red a tension wears, dashed, because it is the same kind
  // of fact — the structure and the wiring saying different things.
  for (const { A, B } of (MACRO.seamLines ?? [])){
    ctx.globalAlpha = mix * 0.85;
    ctx.strokeStyle = cssVar('tension');
    ctx.lineWidth = 1.6/VIEW.k;
    ctx.setLineDash([6/VIEW.k, 4/VIEW.k]);
    ctx.beginPath(); ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const b of bodies.values()){
    const R = b.screenR / VIEW.k;
    ctx.globalAlpha = mix * (litKey(b.key) ? (b.dim ? 0.3 : 1) : 0.15);
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI*2);
    ctx.fillStyle = b.accent; ctx.fill();
    if (b.anomalies){                               // the amber thread, at star-map altitude
      ctx.lineWidth = 2/VIEW.k; ctx.strokeStyle = cssVar('amber');
      ctx.beginPath(); ctx.arc(b.x, b.y, R + 3/VIEW.k, 0, Math.PI*2); ctx.stroke();
    }
    if (b.kind === 'story'){                       // a sun keeps its double ring
      ctx.lineWidth = 1.8/VIEW.k; ctx.strokeStyle = cssVar('violet'); ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x, b.y, R + 4.5/VIEW.k, 0, Math.PI*2); ctx.stroke();
    } else if (b.module === 'principles'){
      ctx.lineWidth = 2.4/VIEW.k; ctx.strokeStyle = cssVar('gold'); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function drawHulls(ctx){
  const t = 1 - Math.max(0, Math.min(1, (VIEW.k - 0.55) / 0.85));
  if (!HULLS || t <= 0.01) return;
  const by = new Map();
  for (const n of SIM.nodes){
    if (!n.module || n.kind === 'model' || n.off) continue;
    by.set(n.module, [...(by.get(n.module) ?? []), n]);
  }
  for (const [name, members] of by){
    if (members.length < 3) continue;
    const hull = hullOf(members.map(n=>({x:n.x, y:n.y})));
    if (hull.length < 3) continue;
    const cx = hull.reduce((a,p)=>a+p.x,0)/hull.length, cy = hull.reduce((a,p)=>a+p.y,0)/hull.length;
    const pad = 26/VIEW.k;                       // breathing room, constant on screen
    ctx.beginPath();
    hull.forEach((p,i)=>{
      const d = Math.hypot(p.x-cx, p.y-cy) || 1;
      const x = p.x + (p.x-cx)/d*pad, y = p.y + (p.y-cy)/d*pad;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.closePath();
    ctx.globalAlpha = 0.06 * t;
    ctx.fillStyle = mods[name]?.accent || cssVar('faint');
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw(){
  const cv = $('#gcanvas'); if (!cv || !SIM) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cv.width/dpr,cv.height/dpr);
  ctx.translate(VIEW.x, VIEW.y); ctx.scale(VIEW.k, VIEW.k);

  const {nodes, edges, adj} = SIM;

  // Which system is the camera standing in? Whichever module owns most of the viewport.
  FOCUS_MODULE = null;
  if (VIEW.k >= MICRO_FULL){
    const counts = new Map();
    let total = 0;
    for (const n of nodes){
      if (n.off) continue;
      const sx = n.x*VIEW.k+VIEW.x, sy = n.y*VIEW.k+VIEW.y;
      if (sx < 0 || sy < 0 || sx > cv.clientWidth || sy > cv.clientHeight) continue;
      total++;
      if (n.module) counts.set(n.module, (counts.get(n.module) ?? 0) + 1);
    }
    // The plurality, with a clear lead over the runner-up: a majority never happens, because a
    // system's rim is by definition mixed with the systems it talks to.
    // A dive names the system explicitly and the name holds while that system still owns a real
    // share of the view; otherwise fall back to whichever module has a clear plurality.
    if (FOCUS_LOCK && (counts.get(FOCUS_LOCK) ?? 0) / Math.max(1,total) >= FOCUS_HOLD){
      FOCUS_MODULE = FOCUS_LOCK;
    } else {
      FOCUS_LOCK = null;
      const ranked = [...counts].sort((a,b)=>b[1]-a[1]);
      if (ranked.length && ranked[0][1] / Math.max(1,total) >= FOCUS_SHARE
          && ranked[0][1] >= (ranked[1]?.[1] ?? 0) * FOCUS_LEAD) FOCUS_MODULE = ranked[0][0];
    }
  }
  // Two dimmings compose: standing inside a system dims the sky, and a root filter dims a shared
  // system nothing on screen reaches. Both are "still there, not what you are looking at".
  const focusA = i => ((FOCUS_MODULE && nodes[i].module !== FOCUS_MODULE) ? FOCUS_DIM : 1)
    * (nodes[i].dim ? 0.3 : 1);

  const hood = HOVER === null ? null : new Set([HOVER, ...adj[HOVER]]);
  const lit = i => (!MATCH || MATCH.has(nodes[i].id)) && (!hood || hood.has(i));
  const showing = i => !nodes[i].off;
  const colors = {violet:cssVar('violet'), faint:cssVar('faint'), gold:cssVar('gold'), tension:cssVar('tension')};
  VIEW_SPAN = Math.min(cv.clientWidth, cv.clientHeight);
  const mix = macroMix();
  const microA = 1 - mix;
  MACRO = mix > 0 ? buildMacro(SIM) : null;

  drawHulls(ctx);

  if (microA > 0) for (const e of edges){
    if (!showing(e.s) || !showing(e.t)) continue;
    const on = lit(e.s) && lit(e.t);
    const st = EDGE_STYLE[e.type] ?? EDGE_STYLE.grounds;
    const A = nodes[e.s], B = nodes[e.t];
    // An edge the pointer is ON is always drawn in full: the fade defers detail, it never hides it.
    const focused = hood !== null && (hood.has(e.s) && hood.has(e.t));
    if (e.type === 'grounds' && VIEW.k < GROUNDS_ZOOM && !focused) continue;
    const fade = edgeFade(A, B, focused);
    ctx.globalAlpha = microA * Math.min(focusA(e.s), focusA(e.t)) * (on ? st.alpha * fade : 0.04);
    ctx.strokeStyle = colors[st.color];
    ctx.lineWidth = st.width/VIEW.k;
    ctx.setLineDash(st.dash ? st.dash.map(d=>d/VIEW.k) : []);
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
    // direction is the whole meaning of refines/consumes: the head sits ON what is depended upon
    if (on && VIEW.k > 0.75 && fade > 0.35 && (e.type==='refines' || e.type==='consumes')){
      const ang = Math.atan2(A.y-B.y, A.x-B.x);
      const tx = B.x+Math.cos(ang)*(B.radius+0.5), ty = B.y+Math.sin(ang)*(B.radius+0.5);
      const sz = 5.5/VIEW.k;
      ctx.beginPath();
      ctx.moveTo(tx,ty);
      ctx.lineTo(tx+Math.cos(ang+0.42)*sz, ty+Math.sin(ang+0.42)*sz);
      ctx.lineTo(tx+Math.cos(ang-0.42)*sz, ty+Math.sin(ang-0.42)*sz);
      ctx.closePath(); ctx.fillStyle = colors[st.color]; ctx.fill();
    }
  }
  // Import edges last among the lines, so they read as a layer over the decision wiring: faint
  // gold, dashed, from the model to the centroid of the cloud that imports it. `consumes` is the
  // same gold solid and thicker, so an import never reads as a decision dependency.
  if (microA > 0) for (const im of SIM.imports){
    const c = SIM.cen.get(im.module); if (!c) continue;
    const n = nodes[im.i];
    if (n.off) continue;
    const focused = hood !== null && hood.has(im.i);
    // an import is cross-module by definition — that is what an import IS
    const fade = edgeFade(n, {x:c.x, y:c.y, module:'\u0000import'}, focused);
    ctx.globalAlpha = microA * focusA(im.i) * (lit(im.i) ? 0.45 : 0.04) * fade;
    ctx.strokeStyle = colors.gold;
    ctx.lineWidth = 0.8/VIEW.k;
    ctx.setLineDash([2/VIEW.k, 4/VIEW.k]);
    ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(c.x,c.y); ctx.stroke();
  }
  // SUGGESTED edges — the links that are not there. Drawn as the faintest thing on the canvas, in
  // the anomaly amber, so a module in pieces shows the seam where the pieces would join.
  if (microA > 0 && INC) for (const s of INC.suggestions){
    const i = SIM.index.get(s.a), j = SIM.index.get(s.b);
    if (i === undefined || j === undefined || nodes[i].off || nodes[j].off) continue;
    const hot = hood !== null && (hood.has(i) || hood.has(j));
    ctx.globalAlpha = microA * (hot ? 0.75 : 0.22) * Math.min(focusA(i), focusA(j));
    ctx.strokeStyle = cssVar('amber');
    ctx.lineWidth = (hot ? 1.4 : 0.9)/VIEW.k;
    ctx.setLineDash([2/VIEW.k, 5/VIEW.k]);
    ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
  }
  ctx.setLineDash([]);

  // Kind is drawn, not just labelled: a story is an ANCHOR (double ring, the sentence a whole
  // branch refines) and a model is a SHAPE apart (diamond — a thing described, not a rule), so
  // the galaxy tells you what sort of record you are looking at before you read anything.
  if (microA > 0) for (let i=0;i<nodes.length;i++){
    const n = nodes[i];
    if (n.off) continue;
    const r = Math.max(n.radius, 2.6/VIEW.k);
    ctx.globalAlpha = microA * focusA(i) * (lit(i) ? 1 : 0.12);
    ctx.beginPath();
    if (n.kind === 'model'){
      const d = r*1.3;
      ctx.moveTo(n.x, n.y-d); ctx.lineTo(n.x+d, n.y); ctx.lineTo(n.x, n.y+d); ctx.lineTo(n.x-d, n.y); ctx.closePath();
    } else {
      ctx.arc(n.x, n.y, r, 0, Math.PI*2);
    }
    ctx.fillStyle = mods[n.module]?.accent
      || (n.kind==='story' ? cssVar('violet') : n.kind==='model' ? cssVar('violet-soft') : cssVar('faint'));
    ctx.fill();
    if (n.kind === 'story'){
      ctx.lineWidth = 1.6/VIEW.k; ctx.strokeStyle = cssVar('violet'); ctx.stroke();
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 3.5/VIEW.k, 0, Math.PI*2); ctx.stroke();   // the anchor's outer ring
    } else if (n.kind === 'model'){
      // A model wears its OWNER's accent (it lives in that cloud) and, when the owner declared it
      // public, a gold ring.
      ctx.lineWidth = 1.6/VIEW.k; ctx.strokeStyle = cssVar('violet'); ctx.stroke();
      if (n.shared){
        const d = r*1.3 + 3.5/VIEW.k;
        ctx.beginPath();
        ctx.moveTo(n.x, n.y-d); ctx.lineTo(n.x+d, n.y); ctx.lineTo(n.x, n.y+d); ctx.lineTo(n.x-d, n.y); ctx.closePath();
        ctx.lineWidth = 1.4/VIEW.k; ctx.strokeStyle = cssVar('gold'); ctx.stroke();
      }
    } else if (n.principle){ ctx.lineWidth = 2/VIEW.k; ctx.strokeStyle = cssVar('gold'); ctx.stroke(); }
    // The anomaly glow: adrift, seam-implicated, or one end of a suggested link. Persistent —
    // it is not a hover state, it is a property of the record until somebody fixes it.
    if (ANOM[n.id]){
      ctx.globalAlpha = microA * focusA(i) * 0.6;
      ctx.lineWidth = 2/VIEW.k; ctx.strokeStyle = cssVar('amber');
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 4/VIEW.k, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = microA * focusA(i) * (lit(i) ? 1 : 0.12);
    }
    // The focused node (and anything focus has been grown from) wears an ink ring of its own.
    if (FOCUS?.seeds.has(n.id)){
      ctx.lineWidth = (n.id === FOCUS.root ? 2.8 : 1.6)/VIEW.k;
      ctx.strokeStyle = cssVar('ink-text');
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 6/VIEW.k, 0, Math.PI*2); ctx.stroke();
    }
    if (n.id === sel){ ctx.lineWidth = 2.5/VIEW.k; ctx.strokeStyle = cssVar('ink-text'); ctx.stroke(); }
  }
  if (mix > 0) drawMacro(ctx, mix);

  // A pulse: rings expanding out of whatever the rail just sent the camera to, so the offender is
  // unmistakable in a field of five hundred dots. It decays and leaves nothing behind.
  if (PULSE){
    const t = Math.min(1, (performance.now()-PULSE.t0)/PULSE_MS);
    const wave = (t*3) % 1;
    for (const id of PULSE.ids){
      const i = SIM.index.get(id); if (i === undefined) continue;
      const n = nodes[i];
      ctx.globalAlpha = (1-t) * (1-wave) * 0.9;
      ctx.strokeStyle = cssVar('amber'); ctx.lineWidth = 2.2/VIEW.k;
      ctx.beginPath(); ctx.arc(n.x, n.y, (10 + wave*44)/VIEW.k, 0, Math.PI*2); ctx.stroke();
    }
    if (!PULSE.ids.size) for (const m of PULSE.bodies){
      const c = SIM.cen.get(m); if (!c) continue;
      ctx.globalAlpha = (1-t) * (1-wave) * 0.8;
      ctx.strokeStyle = cssVar('amber'); ctx.lineWidth = 2.4/VIEW.k;
      ctx.beginPath(); ctx.arc(c.x, c.y, (c.r*0.6 + wave*c.r), 0, Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // ---- labels: a BUDGET first, then collision culling ----
  // Collision culling alone still fills the overview with two hundred equal-weight names, which is
  // what "hard to parse" meant. So the landmarks — stories, models, principles — are always named,
  // and DECISIONS get a budget that grows with zoom: a handful of the heaviest at fit, everything
  // that fits by detail zoom. Leaves are naked dots until you come closer, which is the point.
  const W = cv.width/dpr, H = cv.height/dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textBaseline = 'middle';

  // ---- gap ghosts: a decision that is NOT there ----
  // Drawn in screen space at a fixed size, so a missing decision is exactly as legible from orbit
  // as from the ground — the one thing on the map that must never shrink away.
  layoutGhosts();
  for (const [, p] of GHOSTPOS){
    const sx = p.x*VIEW.k+VIEW.x, sy = p.y*VIEW.k+VIEW.y;
    if (sx<-30||sy<-30||sx>W+30||sy>H+30) continue;
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(sx, sy, 9, 0, Math.PI*2);
    ctx.fillStyle = cssVar('sel'); ctx.fill();
    ctx.setLineDash([3,3]); ctx.lineWidth = 1.4; ctx.strokeStyle = cssVar('amber'); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = `600 11px 'IBM Plex Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.fillStyle = cssVar('amber');
    ctx.fillText('?', sx, sy + 0.5);
    ctx.textAlign = 'left';
  }

  ctx.shadowColor = cssVar('paper'); ctx.shadowBlur = 4;
  const placed = [];
  const hits = r => placed.some(q => r[0]<q[0]+q[2] && q[0]<r[0]+r[2] && r[1]<q[1]+q[3] && q[1]<r[1]+r[3]);
  const onScreen = i => {
    const n = nodes[i];
    const sx = n.x*VIEW.k+VIEW.x, sy = n.y*VIEW.k+VIEW.y;
    return sx>=-60 && sy>=-20 && sx<=W+60 && sy<=H+20;
  };
  // At star-map altitude the only names are the systems themselves.
  if (mix > 0 && MACRO){
    const hoodKeys = HOVER_BODY
      ? new Set([HOVER_BODY, ...MACRO.bands.filter(b=>b.a===HOVER_BODY||b.b===HOVER_BODY).flatMap(b=>[b.a,b.b])])
      : null;
    // Biggest first, so a small body's label yields to a large one when they overlap.
    // This read `y.r - x.r`; bodies carry `screenR`, so every comparison was NaN and the sort
    // silently did nothing — labels came out in insertion order.
    for (const b of [...MACRO.bodies.values()].sort((x,y)=>y.screenR-x.screenR)){
      const sx = b.x*VIEW.k+VIEW.x, sy = b.y*VIEW.k+VIEW.y;
      if (sx<-80||sy<-20||sx>W+80||sy>H+20) continue;
      ctx.font = b.kind === 'story'
        ? `small-caps 700 13px 'IBM Plex Mono', monospace`
        : `600 13.5px 'Source Sans 3', system-ui, sans-serif`;
      const text = b.label;
      const w = ctx.measureText(text).width;
      const gap = b.screenR + 6;
      const x = (sx+gap+w > W-4) ? sx-gap-w : sx+gap;
      const box = [x-2, sy-8, w+4, 16];
      // The badge is drawn whether or not the NAME fits: a count of what is wrong in there is the
      // one thing the star map must always carry.
      if (b.anomalies){
        ctx.globalAlpha = mix;
        const bx = sx + b.screenR*0.8, by = sy - b.screenR*0.8;
        ctx.beginPath(); ctx.arc(bx, by, 7.5, 0, Math.PI*2);
        ctx.fillStyle = cssVar('amber'); ctx.fill();
        ctx.font = `600 9.5px 'IBM Plex Mono', monospace`;
        ctx.textAlign = 'center';
        ctx.fillStyle = cssVar('sel-text');
        ctx.fillText(String(b.anomalies), bx, by + 0.5);
        ctx.textAlign = 'left';
      }
      ctx.font = b.kind === 'story'
        ? `small-caps 700 13px 'IBM Plex Mono', monospace`
        : `600 13.5px 'Source Sans 3', system-ui, sans-serif`;
      if (hits(box)) continue;
      placed.push(box);
      ctx.globalAlpha = mix * (!hoodKeys || hoodKeys.has(b.key) ? 1 : 0.2);
      ctx.fillStyle = b.kind === 'story' ? cssVar('violet') : cssVar('ink-text');
      ctx.fillText(text, x, sy);
    }
  }
  if (microA <= 0.02){ ctx.shadowBlur = 0; ctx.globalAlpha = 1; return; }

  const visible = nodes.map((n,i)=>i).filter(i=>!nodes[i].off && lit(i) && onScreen(i));
  const budget = labelBudget(VIEW.k);
  const take = (kinds, n) => {
    // Standing inside a system, its own members get first claim on the label budget: a foreign
    // planet drifting through the frame should not take a name off one of the locals.
    const pool = visible.filter(i => kinds.includes(nodes[i].kind))
      .sort((a,b) => (FOCUS_MODULE ? (nodes[b].module===FOCUS_MODULE) - (nodes[a].module===FOCUS_MODULE) : 0)
        || nodes[b].radius - nodes[a].radius);
    return n === Infinity ? pool : pool.slice(0, n);
  };
  // Stories and principles are the few true landmarks and are always named. MODELS are not:
  // there are dozens, they share the stories' violet, and at overview they were drowning the very
  // anchors they sit beside — so they get their own smaller budget and arrive as you zoom.
  const order = [
    ...take(['story', 'principle'], Infinity),
    ...take(['model'], budget === Infinity ? Infinity : Math.max(5, Math.round(budget * 0.45))),
    ...take(['decision'], budget),
  ].sort((a,b)=>nodes[b].radius-nodes[a].radius);
  const forced = new Set([HOVER, nodes.findIndex(n=>n.id===sel)].filter(i=>i!==null && i>=0 && !nodes[i].off));
  for (const i of [...forced, ...order]){
    const n = nodes[i];
    const sx = n.x*VIEW.k+VIEW.x, sy = n.y*VIEW.k+VIEW.y;
    if (sx<-60||sy<-20||sx>W+60||sy>H+20) continue;
    const style = n.kind === 'principle'
      ? {font:`small-caps 600 11.5px 'IBM Plex Mono', monospace`, color:cssVar('gold')}
      : n.kind === 'story'
        ? {font:`small-caps 700 13.5px 'IBM Plex Mono', monospace`, color:cssVar('violet')}
      : n.kind === 'model'
        ? {font:`small-caps 600 11.5px 'IBM Plex Mono', monospace`, color:cssVar('violet')}
      : n.root
        ? {font:`500 11px 'Source Sans 3', system-ui, sans-serif`, color:cssVar('ink-text')}
        : {font:`400 9.5px 'Source Sans 3', system-ui, sans-serif`, color:cssVar('muted')};
    ctx.font = style.font;
    const w = ctx.measureText(n.gist).width;
    const gap = n.radius*VIEW.k + 4;
    const x = (sx+gap+w > W-4) ? sx-gap-w : sx+gap;
    const box = [x-2, sy-7, w+4, 14];
    if (!forced.has(i) && hits(box)) continue;
    placed.push(box);
    ctx.globalAlpha = microA * focusA(i) * (forced.has(i) ? 1 : 0.92);
    ctx.fillStyle = style.color;
    ctx.fillText(n.gist, x, sy);
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function fitView({tight=false}={}){
  const cv = $('#gcanvas'); if (!cv || !SIM) return;
  const q = (arr,p) => { const a=[...arr].sort((m,n)=>m-n); return a[Math.floor((a.length-1)*p)]; };
  // Frame what is ACTUALLY in the picture: a filtered-out node must not drag the camera out to
  // include empty space where it used to be.
  const live = SIM.nodes.filter(n=>!n.off);
  const shown = live.length ? live : SIM.nodes;
  const xs = shown.map(n=>n.x), ys = shown.map(n=>n.y);
  // The clusters now spread far enough that trimming a whole 10% clipped visible islands; keep
  // the tight frame for outliers only.
  const lo = tight?0.012:0, hi = tight?0.988:1;
  const x0=q(xs,lo), x1=q(xs,hi), y0=q(ys,lo), y1=q(ys,hi);
  const pad = 30;
  VIEW.k = Math.min(6, Math.max(0.12, Math.min((cv.clientWidth-pad*2)/Math.max(1,x1-x0),
                                               (cv.clientHeight-pad*2)/Math.max(1,y1-y0))));
  VIEW.x = cv.clientWidth/2 - ((x0+x1)/2)*VIEW.k;
  VIEW.y = cv.clientHeight/2 - ((y0+y1)/2)*VIEW.k;
  draw();
}

// Whether the run in flight should fit the view when it settles. A FLAG rather than the
// closure's own `fit`, because the decision can be overtaken: leaving focus restores the camera
// the user had, and an enterFocus run still settling would otherwise fit over the top of it a
// moment later — the view jumping on its own, some time after the gesture that caused it.
let SETTLE_FIT = true;
function run({fit=true}={}){
  cancelAnimationFrame(GRAF);
  SETTLE_FIT = fit;
  const step = () => {
    const t0 = performance.now();
    do { tick(SIM); } while (SIM.alpha > 0.005 && performance.now()-t0 < 12);
    draw();
    if (SIM.alpha > 0.005) GRAF = requestAnimationFrame(step);
    else { GRAF = 0; if (SETTLE_FIT) fitView({tight:true}); else draw(); }
  };
  GRAF = requestAnimationFrame(step);
}
function reheat(to=0.22){ if (!SIM) return; SIM.alpha = Math.max(SIM.alpha, to); if (!GRAF) run({fit:false}); }

// ============================================================ visibility — root chips & focus
// Two filters, ONE mechanism. A node is either in the picture or it is `off`, and `off` means gone
// from the physics as well as from the paint, so whatever is left lays itself out as if the rest
// had never been loaded. Root chips choose by product; focus chooses by neighbourhood.
function nodeVisible(n){
  if (FOCUS) return FOCUS.frontier.has(n.id);
  if (!ROOTS.size) return true;
  // A shared system (platform, process) serves every story, so no product chip may hide it.
  if (n.rootScope === 'shared') return true;
  return ROOTS.has(n.rootScope);
}
function applyVisibility(){
  if (!SIM) return;
  for (const n of SIM.nodes) n.off = !nodeVisible(n);
  // ...but a shared system nothing on screen reaches into is not carrying its weight in this view,
  // and saying so is the point of the chips. It dims; it never disappears.
  //
  // The unit is the SYSTEM, not the record. Per record it measured almost everything as unreached —
  // a platform decision mostly talks to other platform decisions — and greyed the whole shared
  // layer out, which says nothing. Per module it answers the question actually being asked: does
  // the product on screen reach into this system at all?
  const filtering = !FOCUS && ROOTS.size > 0;
  const reachedMod = new Set();
  if (filtering){
    const mark = (from, to) => {
      if (from.off || to.off || from.rootScope === 'shared' || !to.module) return;
      reachedMod.add(to.module);
    };
    for (const e of SIM.edges){ mark(SIM.nodes[e.s], SIM.nodes[e.t]); mark(SIM.nodes[e.t], SIM.nodes[e.s]); }
    for (const im of SIM.imports){
      const n = SIM.nodes[im.i];
      if (!n.off && (mods[im.module]?.rootScope ?? 'shared') !== 'shared' && n.module) reachedMod.add(n.module);
    }
  }
  for (const n of SIM.nodes){
    n.dim = filtering && !n.off && n.rootScope === 'shared' && !reachedMod.has(n.module);
  }
}
function setRoots(next, {settle=true}={}){
  ROOTS = next;
  renderRootChips();
  syncHash();
  applyVisibility();
  // Let the survivors re-settle FIRST and frame them after: fitting on the instant of the change
  // frames a layout that is about to move, and the map appears to slide out from under you.
  if (settle){ SIM.alpha = Math.max(SIM.alpha, 0.3); run({fit:true}); }
  else draw();
}
function renderRootChips(){
  const box = $('#roots');
  const roots = (GD?.roots) ?? [];
  box.hidden = roots.length < 2;                 // one root is not a choice; engineering has none
  if (box.hidden) return;
  box.innerHTML = roots.map(r=>{
    const on = !ROOTS.size || ROOTS.has(r.id);
    return `<button data-root="${esc(r.id)}" class="${on?'on':''}" aria-pressed="${on}"
      title="${esc(r.id)} — ${r.count} record${r.count===1?'':'s'}">${esc(r.key)}<span class="n">${r.count}</span></button>`;
  }).join('');
}
/** A chip toggles its own story. Turning the last one off would leave an empty map, so it resets
 *  to all — "none" and "all" are the same view and the second is the one anybody means. */
function toggleRoot(id){
  const all = new Set(((GD?.roots)??[]).map(r=>r.id));
  const next = ROOTS.size ? new Set(ROOTS) : new Set(all);
  next.has(id) ? next.delete(id) : next.add(id);
  setRoots(next.size === 0 || next.size === all.size ? new Set() : next);
}

// ---- focus: one node and the frontier grown around it -------------------------------------
function growFrontier(id){
  const i = SIM.index.get(id); if (i === undefined) return;
  FOCUS.seeds.add(id); FOCUS.root = id;
  FOCUS.frontier.add(id);
  for (const j of SIM.adj[i]) FOCUS.frontier.add(SIM.nodes[j].id);
}
function enterFocus(id){
  if (!SIM || !SIM.index.has(id)) return;
  if (!FOCUS) FOCUS = { root:id, seeds:new Set(), frontier:new Set(),
    saved:{ view:{...VIEW}, roots:new Set(ROOTS), lock:FOCUS_LOCK } };
  growFrontier(id);
  closeOverlay();
  applyVisibility();
  renderFocusBar();
  syncHash();
  SIM.alpha = Math.max(SIM.alpha, 0.5);
  run({fit:true});
}
function exitFocus({restore=true}={}){
  if (!FOCUS) return;
  const saved = FOCUS.saved;
  FOCUS = null;
  ROOTS = saved.roots;
  FOCUS_LOCK = saved.lock;
  renderRootChips();
  applyVisibility();
  renderFocusBar();
  syncHash();
  reheat(0.4);
  // Whatever is still settling must not fit over the camera we are about to restore.
  if (restore){ SETTLE_FIT = false; animateTo(saved.view.k, saved.view.x, saved.view.y, 420); }
  else draw();
}
function renderFocusBar(){
  const bar = $('#focusbar');
  if (!FOCUS){ bar.hidden = true; return; }
  const d = byId[FOCUS.root];
  bar.hidden = false;
  bar.innerHTML = `<span>Focus</span> <b>${esc(d?.gist || FOCUS.root)}</b>
    <span class="hint">${FOCUS.frontier.size} in frontier · double-click a neighbour to grow it</span>
    <button class="x" data-unfocus title="Leave focus (esc)">✕</button>`;
}

// ============================================================ the incoherence rail
const RAIL_SECTIONS = [
  ['crossing', 'Crossings', 'A reference the one-way rule forbids: product → capability → model → engineering, never back and never sideways.'],
  ['adrift', 'Adrift records', 'Records that sit in a tree with no link to the rest of it — the tree falls into pieces.'],
  ['gap', 'Open gaps', 'A moment where a standing decision was missing and none has been written since (eng:log-ledger-interactions).'],
  ['suggestion', 'Link suggestions', 'Same-tree records with no path between them that share rare vocabulary — the candidate edges that would close a tree.'],
];
function renderRail(){
  const body = $('#r-body');
  if (!INC){ body.innerHTML = '<p class="rempty">loading…</p>'; return; }
  const inScope = e => !e.focus?.length || e.focus.some(id => SIM && SIM.index.has(id))
    || (e.bodies ?? []).some(m => mods[m]);
  const entries = INC.entries.filter(inScope);
  $('#r-count').textContent = entries.length;
  body.innerHTML = RAIL_SECTIONS.map(([kind, title, why]) => {
    const rows = entries.filter(e => e.kind === kind);
    if (!rows.length) return '';
    return `<section class="rsec"><h5>${esc(title)}<span class="c">${rows.length}</span></h5>
      <p class="why">${esc(why)}</p>
      ${rows.map(e=>`<button class="rent k-${esc(e.kind)}" data-rail="${esc(e.id)}">
        <span class="t">${esc(e.title)}</span><span class="d">${esc(trunc(e.detail||'', 190))}</span></button>`).join('')}
    </section>`;
  }).join('') || '<p class="rempty">Nothing to complain about in this scope.</p>';
  const note = logNote();
  if (note) body.innerHTML += `<p class="rempty">${esc(note)}</p>`;
}
/** The interaction log is machine-local telemetry (eng:log-ledger-interactions): absent, the
 *  tallies and gaps read empty and say so in one line; malformed lines were skipped on read. */
function logNote(){
  const l = ALL?.interactionLog;
  if (!l) return '';
  if (!l.present) return `No interaction log on this machine (${l.file}) — tallies and gaps read empty.`;
  return l.bad?.length ? `${l.bad.length} malformed line(s) in ${l.file} skipped — run --check to see them.` : '';
}
function toggleRail(open){
  RAIL_OPEN = open ?? !RAIL_OPEN;
  $('#rail').classList.toggle('shut', !RAIL_OPEN);
  syncHash();
  size(); draw();
}
/** Fly to an entry's offenders and pulse them. If they are filtered out of the current view, the
 *  filter yields — being sent to something you cannot see would be the opposite of the point. */
function railClick(id){
  clearTimeout(CLICK_T); // a click still waiting to open an overlay must not land mid-flight
  const e = INC?.entries.find(x => x.id === id);
  if (!e || !SIM) return;
  if (FOCUS) exitFocus({restore:false});
  const present = (e.focus ?? []).filter(x => SIM.index.has(x));
  if (present.some(x => SIM.nodes[SIM.index.get(x)].off)) setRoots(new Set(), {settle:false});
  const pts = present.map(x => SIM.nodes[SIM.index.get(x)]);
  if (e.kind === 'gap'){
    const g = GHOSTPOS.get(e.id);
    if (g) pts.push(g);
  }
  for (const m of (e.bodies ?? [])) { const c = SIM.cen.get(m); if (c && !pts.length) pts.push(c); }
  pulse(present, e.bodies ?? []);
  if (!pts.length) return;
  const cv = $('#gcanvas');
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const w = Math.max(160, Math.max(...xs)-Math.min(...xs)), h = Math.max(160, Math.max(...ys)-Math.min(...ys));
  const k = Math.max(0.5, Math.min(2.6, Math.min((cv.clientWidth-160)/w, (cv.clientHeight-160)/h)));
  const cx = (Math.min(...xs)+Math.max(...xs))/2, cy = (Math.min(...ys)+Math.max(...ys))/2;
  FOCUS_LOCK = e.module ?? null;
  animateTo(k, cv.clientWidth/2 - cx*k, cv.clientHeight/2 - cy*k, 620);
}
let PRAF = 0;
const PULSE_MS = 2400;
function pulse(ids, bodies){
  PULSE = { ids:new Set(ids), bodies:new Set(bodies||[]), t0:performance.now() };
  cancelAnimationFrame(PRAF);
  const step = () => {
    draw();
    if (PULSE && performance.now()-PULSE.t0 < PULSE_MS) PRAF = requestAnimationFrame(step);
    else { PULSE = null; PRAF = 0; draw(); }
  };
  PRAF = requestAnimationFrame(step);
}
/** Where each open gap's ghost sits: outside the rim of the system whose decisions its text cites,
 *  because a gap is precisely a place that system has no record for. A gap citing nothing floats
 *  in open space, which is the honest picture of it. */
function layoutGhosts(){
  GHOSTPOS = new Map();
  if (!SIM) return;
  GHOSTS.forEach((g, i) => {
    const ang = i * 2.39996;                            // golden angle: no two ghosts stack up
    if (g.module){
      const c = SIM.cen.get(g.module);
      if (!c) return;                                   // its system is not in this view
      GHOSTPOS.set(g.id, { x: c.x + Math.cos(ang)*c.r*2.1, y: c.y + Math.sin(ang)*c.r*2.1, g });
    } else {
      GHOSTPOS.set(g.id, { x: SIM.w/2 + Math.cos(ang)*SIM.w*0.36, y: SIM.h/2 + Math.sin(ang)*SIM.h*0.36, g });
    }
  });
}
function ghostAt(px, py){
  for (const [, p] of GHOSTPOS){
    const sx = p.x*VIEW.k+VIEW.x, sy = p.y*VIEW.k+VIEW.y;
    if (Math.hypot(sx-px, sy-py) < 12) return p.g;
  }
  return null;
}

const toWorld = (px,py) => ({x:(px-VIEW.x)/VIEW.k, y:(py-VIEW.y)/VIEW.k});
function nodeAt(px,py){
  const {x,y} = toWorld(px,py);
  let best=null, bestD=Infinity;
  SIM.nodes.forEach((n,i)=>{ if (n.off) return; const d=Math.hypot(n.x-x,n.y-y); if (d < n.radius+6/VIEW.k && d<bestD){best=i;bestD=d;} });
  return best;
}
/** Fly the camera. Diving into a system has to feel like ARRIVING somewhere — a hard cut leaves
 *  you wondering whether the map changed under you. */
let FLIGHT = 0;
function animateTo(k, x, y, ms = 520){
  cancelAnimationFrame(FLIGHT);
  const from = { ...VIEW }, t0 = performance.now();
  const ease = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  const step = () => {
    const t = Math.min(1, (performance.now()-t0)/ms), e = ease(t);
    VIEW.k = from.k + (k-from.k)*e;
    VIEW.x = from.x + (x-from.x)*e;
    VIEW.y = from.y + (y-from.y)*e;
    draw();
    if (t < 1) FLIGHT = requestAnimationFrame(step); else FLIGHT = 0;
  };
  FLIGHT = requestAnimationFrame(step);
}

/** Which system body is under the pointer, when the map is at star-map altitude. */
function bodyAt(px, py){
  if (!MACRO || macroMix() < 0.5) return null;
  const { x, y } = toWorld(px, py);
  let best = null, bestD = Infinity;
  for (const b of MACRO.bodies.values()){
    const d = Math.hypot(b.x-x, b.y-y);
    if (d < (b.screenR + 8)/VIEW.k && d < bestD){ best = b; bestD = d; }
  }
  return best;
}

/** Enter a system: frame its members, which crosses the threshold and turns the body back into
 *  the decisions it was standing for. */
function diveInto(body){
  const cv = $('#gcanvas');
  // Frame the SYSTEM, not its stragglers. An adrift member hangs far out by design (that is the
  // incoherence made visible), and letting it set the frame zooms the camera back out until the
  // viewport is mostly other people's systems — which was the complaint.
  const c0 = { x: body.members.reduce((a,n)=>a+n.x,0)/body.n, y: body.members.reduce((a,n)=>a+n.y,0)/body.n };
  // the module's own mean radius, the same measure the physics uses
  const meanR = Math.max(20, body.members.reduce((a,n)=>a+Math.hypot(n.x-c0.x, n.y-c0.y),0)/body.n);
  let core = body.members.filter(n => Math.hypot(n.x-c0.x, n.y-c0.y) <= meanR * 1.8);
  if (core.length < Math.max(3, body.n * 0.5)) core = body.members;
  const xs = core.map(n=>n.x), ys = core.map(n=>n.y);
  const w = Math.max(60, Math.max(...xs)-Math.min(...xs)), h = Math.max(60, Math.max(...ys)-Math.min(...ys));
  const k = Math.min(3.6, Math.max(MICRO_FULL + 0.55,
    Math.min((cv.clientWidth-90)/w, (cv.clientHeight-90)/h)));
  const cx = (Math.min(...xs)+Math.max(...xs))/2, cy = (Math.min(...ys)+Math.max(...ys))/2;
  HOVER_BODY = null;
  FOCUS_LOCK = body.kind === 'story' ? null : body.module;
  animateTo(k, cv.clientWidth/2 - cx*k, cv.clientHeight/2 - cy*k);
}

function centerOn(id){
  if (!SIM || !SIM.index.has(id)) return false;
  const n = SIM.nodes[SIM.index.get(id)];
  const cv = $('#gcanvas');
  const k = Math.max(VIEW.k, 1.6);
  HOVER = SIM.index.get(id);
  HOVER_BODY = null;
  // From the star map this is a DESCENT, not a jump: the camera flies down through the threshold
  // into the system the decision lives in, and the planets resolve on the way.
  animateTo(k, cv.clientWidth/2 - n.x*k, cv.clientHeight/2 - n.y*k, macroMix() > 0 ? 700 : 420);
  return true;
}

// ============================================================ detail overlay
function badges(d){
