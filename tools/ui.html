// ============================================================ boot + routing
// The whole view is in the hash — scope, which products are on screen, whether the rail is open —
// so a view IS a link. Focus is deliberately left out: it is a excursion you come back from, and
// its exit promises the camera and the chips you had before.
let HASHING = false;
function syncHash(){
  const parts = [];
  if (ROOTS.size) parts.push('roots=' + [...ROOTS].map(r=>r.replace(/^story:/,'')).join(','));
  if (RAIL_OPEN) parts.push('rail=1');
  HASHING = true;
  location.hash = '#/' + (isGalaxy() ? SCOPE : MODE) + (parts.length ? '?' + parts.join('&') : '');
  setTimeout(()=>{ HASHING = false; }, 0);
}
function parseHash(){
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const [path, query] = raw.split('?');
  const p = new URLSearchParams(query || '');
  return {
    // The path is the MODE when it names one, and the galaxy's scope otherwise — one segment,
    // because the scope only means anything inside the galaxy.
    mode: window.AdroitViews?.has(path) ? path : 'galaxy',
    scope: path === 'engineering' ? 'engineering' : 'product',
    roots: (p.get('roots') || '').split(',').filter(Boolean).map(s=>'story:'+s),
    rail: p.get('rail') === '1',
  };
}

async function load(scope, {roots} = {}){
  clearTimeout(CLICK_T); // a click from the outgoing scope has nothing to open in the new one
  SCOPE = scope;
  document.querySelectorAll('.scope button').forEach(b=>b.classList.toggle('on', b.dataset.scope===scope));
  GD = await (await fetch('/api/graphdata?scope='+scope)).json();
  mods = {}; GD.modules.forEach(m=>mods[m.name]=m);
  $('#counts').textContent = `${GD.nodes.length} decisions · ${GD.edges.length} links · ${GD.modules.length} modules`;
  const kinds = new Set(GD.nodes.map(n=>n.kind));
  $('#legend').innerHTML = Object.entries(EDGE_STYLE)
      .map(([t,st])=>`<span><i style="border-top-color:${cssVar(st.color)};border-top-style:${st.dash?'dashed':'solid'}"></i>${t}</span>`).join('')
    + (kinds.has('story') ? `<span style="color:var(--violet)">◎ story</span>` : '')
    + (kinds.has('model') ? `<span style="color:var(--violet)">◇ model</span>` : '')
    + ((GD.imports||[]).length ? `<span><i style="border-top-color:${cssVar('gold')};border-top-style:dashed"></i>reads</span>` : '')
    + (kinds.has('principle') ? `<span style="color:var(--gold)">◉ principle</span>` : '')
    + `<span style="color:var(--amber)">◍ anomaly</span>`
    + ((INC?.gaps||[]).length ? `<span style="color:var(--amber)">? open gap</span>` : '')
    + (INC?.suggestions?.length ? `<span><i style="border-top-color:${cssVar('amber')};border-top-style:dashed"></i>suggested link</span>` : '')
    + `<span>size = decisions that depend on it</span>`;
  const cv = $('#gcanvas');
  size();
  SIM = makeSim(GD, cv.clientWidth*1.9, cv.clientHeight*1.9);
  HOVER = null; MATCH = null; $('#q').value = ''; $('#hits').hidden = true;
  FOCUS = null; renderFocusBar();
  // A scope change re-scopes the corpus, so a chip for a story this scope does not have is dropped
  // rather than silently filtering everything away.
  const have = new Set(GD.roots.map(r=>r.id));
  ROOTS = new Set([...(roots ?? [...ROOTS])].filter(r=>have.has(r)));
  renderRootChips();
  GHOSTS = (INC?.gaps ?? []).filter(g=>!g.module || mods[g.module]);
  applyVisibility();
  renderRail();
  syncHash();
  VIEW = {k:1,x:0,y:0};
  run();
}
function size(){
  const cv = $('#gcanvas'), dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth*dpr; cv.height = cv.clientHeight*dpr;
}

// ---- the mode switcher ----
// Four views onto one store. The galaxy is the whole corpus at once; the other three are for
// walking it, and they live in /ui/views.js with their own host element. The mode is part of the
// hash, so a view is a link here exactly as the galaxy's scope and chips already were.
async function setMode(mode, {hash=true} = {}){
  if (mode !== 'galaxy' && !window.AdroitViews?.has(mode)) mode = 'galaxy';
  MODE = mode;
  document.body.dataset.mode = mode;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('#views').hidden = isGalaxy();
  if (isGalaxy()){
    size(); draw();               // the canvas had no size while it was hidden; positions are kept
  } else {
    closeOverlay();
    cancelAnimationFrame(GRAF); GRAF = 0;   // the simulation pauses rather than being discarded
    $('#hits').hidden = true;
    await window.AdroitViews.activate(mode, $('#views'));
  }
  if (hash) syncHash();
}

async function boot(){
  const [all, inc] = await Promise.all([
    (await fetch('/api/graph')).json(),
    (await fetch('/api/incoherence')).json(),
  ]);
  ALL = all;
  INC = inc; ANOM = inc.anomalies || {};
  (ALL.modules || []).forEach(m => { MODMETA[m.name] = m; });   // purpose/blurb for the macro tooltip
  ALL.decisions.forEach(d => { byId[d.id] = d; });   // decorated: kind, moduleScoped, gist, rootScope
  for (const e of (ALL.interactions||[])) for (const id of (e.decisions||[])) (IXN[id] ??= []).push(e);
  for (const k of Object.keys(IXN)) IXN[k].sort((a,b)=>(b.ts||0)-(a.ts||0));
  const h = parseHash();
  RAIL_OPEN = h.rail;
  $('#rail').classList.toggle('shut', !RAIL_OPEN);
  $('#r-count').textContent = INC.counts.total;
  await load(h.scope, {roots: h.roots});
  // The galaxy is built first whatever the hash says — it owns the canvas and the camera, and a
  // mode switch is cheap once it exists. `load` has just written its own scope into the hash, so
  // this writes the mode back over it rather than leaving the address lying about the view.
  await setMode(h.mode);
}

// ---- canvas interaction ----
const cv = $('#gcanvas');
let pan = null, grab = null, lastMoved = 0;
cv.onmousedown = ev => {
  const r = cv.getBoundingClientRect();
  const hit = macroMix() >= 0.5 ? null : nodeAt(ev.clientX-r.left, ev.clientY-r.top);
  if (hit !== null){ grab = {i:hit, x:ev.clientX, y:ev.clientY, moved:0}; SIM.nodes[hit].pinned = true; reheat(0.22); }
  else pan = {x:ev.clientX, y:ev.clientY, vx:VIEW.x, vy:VIEW.y, moved:0};
  cv.style.cursor = 'grabbing';
};
window.onmouseup = () => {
  lastMoved = (grab?.moved ?? 0) + (pan?.moved ?? 0);
  if (grab) reheat(0.12);                      // dropped nodes stay put; the web settles around them
  grab = null; pan = null;
  cv.style.cursor = 'default';
};
cv.onmousemove = ev => {
  const r = cv.getBoundingClientRect();
  const px = ev.clientX-r.left, py = ev.clientY-r.top;
  if (grab){
    grab.moved += Math.abs(ev.clientX-grab.x)+Math.abs(ev.clientY-grab.y);
    grab.x = ev.clientX; grab.y = ev.clientY;
    const w = toWorld(px,py), n = SIM.nodes[grab.i];
    n.x=w.x; n.y=w.y; n.vx=n.vy=0;
    reheat(0.2);
    return draw();
  }
  if (pan){
    pan.moved += Math.abs(ev.clientX-pan.x)+Math.abs(ev.clientY-pan.y);
    VIEW.x = pan.vx+(ev.clientX-pan.x); VIEW.y = pan.vy+(ev.clientY-pan.y);
    return draw();
  }
  const tip = $('#gtip');
  const gh = ghostAt(px,py);
  if (gh){
    cv.style.cursor = 'pointer';
    tip.hidden = false;
    tip.innerHTML = `<b>open gap</b> · ${esc(gh.where||'')}<br>${esc(trunc(gh.note||'',200))}`
      + `<br><span style="opacity:.6">click to read it</span>`;
    tip.style.left = Math.min(px+14, cv.clientWidth-340)+'px';
    tip.style.top = (py+14)+'px';
    return;
  }
  // At star-map altitude the pointer talks to SYSTEMS, not to decisions.
  if (macroMix() >= 0.5){
    const b = bodyAt(px,py);
    cv.style.cursor = b ? 'pointer' : 'default';
    if (HOVER !== null) HOVER = null;
    if ((b ? b.key : null) !== HOVER_BODY){ HOVER_BODY = b ? b.key : null; draw(); }
    if (!b){ tip.hidden = true; return; }
    const links = MACRO.bands.filter(x=>x.a===b.key||x.b===b.key);
    tip.hidden = false;
    tip.innerHTML = `<b>${esc(b.label)}</b> \u00b7 ${b.n} decision${b.n===1?'':'s'} \u00b7 `
      + `${links.length} connected system${links.length===1?'':'s'}`
      + (b.purpose ? `<br>${esc(trunc(b.purpose,190))}` : '')
      + `<br><span style="opacity:.6">click to enter</span>`;
    tip.style.left = Math.min(px+14, cv.clientWidth-340)+'px';
    tip.style.top = (py+14)+'px';
    return;
  }
  if (HOVER_BODY !== null) HOVER_BODY = null;
  const hit = nodeAt(px,py);
  cv.style.cursor = hit===null ? 'default' : 'grab';
  if (hit !== HOVER){ HOVER = hit; draw(); }
  if (hit === null){ tip.hidden = true; return; }
  const n = SIM.nodes[hit];
  tip.hidden = false;
  const model = (n.kind === 'model' || n.kind === 'view') && n.importers?.length
    ? ` · <span style="color:var(--gold)">read by ${esc(n.importers.join(', '))}</span>`
    : '';
  tip.innerHTML = `<b>${esc(n.id)}</b> · ${esc(n.module||'—')} · ${n.inbound} inbound${model}<br>${esc(trunc(n.decision,150))}`;
  tip.style.left = Math.min(px+14, cv.clientWidth-340)+'px';
  tip.style.top = (py+14)+'px';
};
cv.onmouseleave = () => { HOVER = null; HOVER_BODY = null; $('#gtip').hidden = true; draw(); };
cv.onclick = ev => {
  if (lastMoved > 3){ lastMoved = 0; return; }   // a drag is not a click
  lastMoved = 0;
  const r = cv.getBoundingClientRect();
  const px = ev.clientX-r.left, py = ev.clientY-r.top;
  const ghost = ghostAt(px,py);
  if (ghost) return openGapOverlay(ghost);
  if (macroMix() >= 0.5){
    const b = bodyAt(px,py);
    // A story is one decision wearing a sun's clothes, so opening it is right; a module body
    // stands for many, so clicking it means GO THERE.
    if (b) b.kind === 'story' ? openOverlay(b.members[0].id) : diveInto(b);
    return;
  }
  const hit = nodeAt(px,py);
  if (hit === null) return;
  // A double-click on a node means FOCUS, so opening the overlay waits a beat to see whether a
  // second click is coming. Without the wait the overlay opens under the first click and swallows
  // the second, and the gesture can never be made. 180ms reads as instant.
  const id = SIM.nodes[hit].id;
  clearTimeout(CLICK_T);
  CLICK_T = setTimeout(() => openOverlay(id), 180);
};
// Double-click is the shortcut into focus, and — on a node already in the frontier — the way to
// push that frontier out one more ring.
cv.ondblclick = ev => {
  clearTimeout(CLICK_T);
  const r = cv.getBoundingClientRect();
  const hit = nodeAt(ev.clientX-r.left, ev.clientY-r.top);
  if (hit !== null){ ev.preventDefault(); enterFocus(SIM.nodes[hit].id); }
};
cv.onwheel = ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  const px = ev.clientX-r.left, py = ev.clientY-r.top;
  const before = toWorld(px,py);
  VIEW.k = Math.min(6, Math.max(0.12, VIEW.k*(ev.deltaY<0?1.12:1/1.12)));
  VIEW.x = px-before.x*VIEW.k; VIEW.y = py-before.y*VIEW.k;
  draw();
};
// A hidden canvas has no size, so re-fitting one would divide the camera by zero; the galaxy is
// re-sized when it comes back instead.
window.onresize = () => { if (!isGalaxy()) return; size(); fitView({tight:true}); };

// ---- page interaction ----
document.addEventListener('click', e => {
  // Scoped to the switcher on purpose: `body` carries data-mode too (the CSS reads it), so a bare
  // [data-mode] closest() matches EVERY click in the document and re-activates the view under it.
  const md = e.target.closest('#modes [data-mode]');
  if (md){ setMode(md.dataset.mode); return; }
  if (!isGalaxy()) return;                  // every other gesture belongs to the view on screen
  const sc = e.target.closest('[data-scope]');
  if (sc){ closeOverlay(); load(sc.dataset.scope); return; }
  const rt = e.target.closest('[data-root]');
  if (rt){ toggleRoot(rt.dataset.root); return; }
  const rl = e.target.closest('[data-rail]');
  if (rl){ closeOverlay(); railClick(rl.dataset.rail); return; }
  const fo = e.target.closest('[data-focus]');
  if (fo){ enterFocus(fo.dataset.focus); return; }
  if (e.target.closest('[data-unfocus]')) return exitFocus();
  if (e.target.closest('#r-toggle')) return toggleRail();
  const op = e.target.closest('[data-open]');
  if (op){ $('#hits').hidden = true; openOverlay(op.dataset.open); return; }
  const g = e.target.closest('[data-goto]');
  if (g){
    const id = g.dataset.goto;
    if (!byId[id]) return;
    // a chip for a decision in the OTHER graph switches scope to reach it
    if (SIM && !SIM.index.has(id)){
      const other = SCOPE === 'product' ? 'engineering' : 'product';
      load(other).then(() => setTimeout(() => openOverlay(id), 60));
      return;
    }
    openOverlay(id);
    return;
  }
  if (e.target.closest('[data-close]')) return closeOverlay();
  if (e.target.id === 'ovl') return closeOverlay();          // click outside the box
  if (e.target.id === 'g-fit'){ HOVER = null; HOVER_BODY = null; FOCUS_LOCK = null; return fitView({tight:true}); }
  if (e.target.id === 'g-reheat'){
    SIM = makeSim(GD, cv.clientWidth*1.9, cv.clientHeight*1.9);   // drops every pin
    run();
    return;
  }
  if (!e.target.closest('.finder')) $('#hits').hidden = true;
});
document.addEventListener('keydown', e => {
  if (!isGalaxy()) return;                  // the walked views bind their own keys
  // Escape unwinds one layer at a time: the overlay, then focus, then the search.
  if (e.key === 'Escape'){
    if (!$('#ovl').hidden) closeOverlay();
    else if (FOCUS) exitFocus();
    else { $('#q').value=''; runSearch(); }
  }
  if (e.key === 'Enter' && document.activeElement === $('#q')){
    const first = $('#hits button[data-open]');
    if (first) openOverlay(first.dataset.open);
  }
  if (e.key === '/' && document.activeElement !== $('#q')){ e.preventDefault(); $('#q').focus(); }
});
$('#q').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(runSearch, 150); });
window.addEventListener('hashchange', () => {
  if (HASHING) return;                       // our own write, not a navigation
  const h = parseHash();
  if (h.mode !== MODE) return void setMode(h.mode, {hash:false});
  if (!isGalaxy()) return;
  if (h.scope !== SCOPE) return void load(h.scope, {roots: h.roots});
  const want = new Set(h.roots.filter(r => (GD?.roots ?? []).some(x => x.id === r)));
  if ([...want].sort().join() !== [...ROOTS].sort().join()) setRoots(want);
  if (h.rail !== RAIL_OPEN) toggleRail(h.rail);
});
boot();
</script>
