name: Malformed shown in place
decisions:
  - id: ui:malformed-shown-in-place
    decision: >-
      The tool finds every place an opened ledger is invalid or malformed and shows each finding on
      the node or directory at fault.
  - id: ui:findings-list-travels
    decision: >-
      Every finding also appears in one list, and selecting a finding takes the user to its place.
    rejected:
      - >-
        a findings list with no place in the ledger — a finding the user has to go hunting for is a
        retrieval failure
  - id: ui:broken-ledger-still-opens
    decision: >-
      An invalid ledger still opens and shows everything that can be read; nothing is refused for
      being broken.
    rejected:
      - >-
        refusing to load a ledger until it is valid — a broken ledger is exactly the one a user
        needs to look at, and refusing is a fence (inform-don't-fence)
  - id: ui:findings-match-the-check
    decision: The findings are the ones the ledger check reports, from the same rules.
    rejected:
      - >-
        a second set of validation rules inside the UI beside the check — two validators drift
        apart; one definition serves both (single-resolver)
context:
  why: >-
    "validation of a ledger itself... it should be able to find places where the ledger is invalid
    or malformed"; "it opens and shows what it can". Sharing the check's rules was a below-the-bar
    call. The rules themselves are not listed here: the methodology's records are the set
    (eng:enumeration-is-drift)
  src: ui product-tree session 2026-10-10 (user-directed)
