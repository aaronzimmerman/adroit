id: ui:engineering-left-out-of-scope
name: Engineering left out of scope
decision: >-
  The details panel of a product or capability node leaves engineering out of what binds there;
  engineering is explored as its own tree in the navigation panel.
rejected:
  - >-
    engineering as a collapsed group in every node's binding scope — engineering decisions are
    mechanical (languages, frameworks, stores) and matter only when writing code, not when reading
    or ruling a product decision
