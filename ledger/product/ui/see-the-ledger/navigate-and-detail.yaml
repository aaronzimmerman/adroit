name: Navigate and detail
decisions:
  - id: ui:navigation-panel-left
    decision: >-
      A navigation panel on the left shows the hierarchy from the roots down, and from it the user
      goes up a level, goes down, or selects any child as the current node.
    rejected:
      - >-
        a star map explored as one continuous space — flying, zooming and self-similar named wholes
        were not helpful for reading what binds a node; the hierarchy is the thing to walk
  - id: ui:details-panel-right
    decision: >-
      A details panel on the right shows the current node: its peer decisions with their rejected
      alternatives, its dubious mark and its questions.
  - id: ui:edit-in-the-details-panel
    decision: The current node is edited in place in the details panel.
  - id: ui:ancestors-grouped-by-ancestor
    decision: >-
      The details panel shows the decisions still binding from above, grouped by the ancestor that
      holds them.
  - id: ui:capabilities-shown-summarized
    decision: >-
      Each capability the current node or an ancestor includes is summarized in the details panel by
      its root node's decisions.
    rejected:
      - >-
        the capability's whole subtree inline — it buries the node being read; the root's decisions
        already state what an includer takes on
  - id: ui:open-a-capability
    decision: >-
      From a capability's summary the user can open the capability in the navigation panel to walk
      its full subtree.
  - id: ui:one-layout-every-root
    decision: >-
      The product, capability and engineering trees all use the same navigation and details layout.
    rejected:
      - >-
        a native visual treatment per root (a star map for product trees, peer groves for
        engineering) — every root is now nodes in a hierarchy, and what a reader needs at any node
        is the same: its decisions and everything binding it
  - id: ui:models-read-as-fields
    decision: Models read as their fields, not as decision trees.
context:
  why: >-
    "a navigation panel on the left that lets me go up and down the hierarchy and then a details
    panel on the right with the current node's decisions, and the ability to edit... a lot of the
    star-field stuff goes away, it isn't really helpful"; models keep their own read because they are
    not nodes
  src: ui product-tree session 2026-10-12 (user-directed)
