id: ui:change-the-ledger
name: Change the ledger
decision: >-
  A user can change the ledger: revise a decision, edit a single field in place, and add a node
  beneath another.
rejected:
  - >-
    notes on a decision — a prose margin channel beside the record is the shadow-ledger risk the
    interactions log already rejected, and content worth keeping belongs in the record's own fields
  - >-
    surfacing similarity — convergent decisions visualized as common shapes before any connectivity
    exists — a nice-to-have, not core; extraction stays a user-initiated act on a pattern the user
    already sees
