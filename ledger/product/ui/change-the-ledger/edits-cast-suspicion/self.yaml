id: ui:suspect-set-shown
name: Edits cast suspicion
decision: Before a change commits, the UI shows every node the change makes suspect.
rejected:
  - >-
    walking the user through each suspect, confirming or editing it before the commit — the UI
    provides a view to see what the change reaches; working a suspect is the ordinary confirm or
    edit on that node, done whenever the person chooses
context: >-
  "labeling decisions as dubious for that kind of situation where there is reason to expect this is
  no longer coherent"; "The UI doesn't need to walk you through anything it just needs to provide a
  view to let you see". What makes a node suspect, and the mark's semantics, are the methodology's
  (ADROIT.md, Dubious); this node holds only what the UI does about them.
