name: Current and proposed visible
decisions:
  - id: ui:current-and-proposed-visible
    decision: >-
      Wherever a model or its fields appear, a pending change shows both states — deployed and
      intended — until the migration lands, as the normal view rather than behind a compare mode.
    rejected:
      - >-
        showing the projected result alone — the reader loses what the pending change costs, and a
        model field would claim a shape the store does not hold
  - id: ui:ruling-shows-one-state
    decision: >-
      A ruling's in-flight edits show as the working diff and vanish at commit; the UI never renders
      proposed text beside a committed decision.
    rejected:
      - >-
        enduring dual state for rulings too (this record's first form, 2026-10-08) — "when we make a
        ruling that is a point in time"; versioned ruling layers reintroduce the decision states the
        corpus rejected, and source control already carries a ruling's history
context:
  why: >-
    "model changes have to endure in pending state as a consequence of making a decision. The
    decision is committed atomically... and the result of that decision is a pending database change
    that has to exist in multiple states"
  src: ui product-tree session 2026-10-08
