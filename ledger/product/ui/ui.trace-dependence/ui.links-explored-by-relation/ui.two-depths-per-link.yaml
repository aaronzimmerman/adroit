id: ui:two-depths-per-link
decision: >-
  Every link offers two depths, whatever its relation: high-level details of the
  linked thing presented in the context of the decision being read — a consumed
  capability's summary, a grounds principle's text, a tension link's text with
  the divergence it marks stated — and the option to move to the linked thing's
  full context, its own tree or view (a cut when it crosses roots,
  ui:cross-root-is-a-cut).
rejected:
  - >-
    ruling the gestures (hover previews, click jumps) — that is specifying a
    screen (eng:stories-not-interfaces); the need is the two depths, not the
    input that reaches them
  - >-
    one depth per relation (gist-only for principles, travel-only for
    capabilities) — the user reading a decision sometimes needs the gist without
    leaving and sometimes the whole context; the relation doesn't predict which
links:
  domain: ui
context:
  why: >-
    "a user is given high-level details in context of a decision's capabilities
    and then there's also the option of linking to the full context" — confirmed
    relation-generic, dissolving the probe's grounds-and-tension finding
  src: ui product-tree session 2026-10-08; regeneration probe round one, finding eight
