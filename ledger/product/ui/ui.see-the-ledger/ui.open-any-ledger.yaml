id: ui:open-any-ledger
decision: >-
  A user can point the tool at the root directory of any adroit ledger and work
  with that ledger, not only the one in the repository the tool ships in.
rejected:
  - >-
    a tool bound to its own repository's ledger — the methodology is adopted by
    other projects, and their ledgers are the ones that most need understanding
links:
  domain: ui
context:
  why: >-
    "the tool can load a root directory that's supposed to have an adroit ledger"
    — the precondition for validating ledgers other than this one
  src: ui product-tree session 2026-10-10 (user-directed)
