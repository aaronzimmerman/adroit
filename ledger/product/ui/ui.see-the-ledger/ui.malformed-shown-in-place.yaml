id: ui:malformed-shown-in-place
decision: >-
  The tool finds every place an opened ledger is invalid or malformed under the
  methodology's rules, and shows each finding where it lives: on the record or
  directory at fault, and in one list of all findings, each of which takes the
  user to its place. An invalid ledger still opens and shows everything that can
  be read. Nothing is refused for being broken. The findings are the same ones
  the ledger check reports, from the same rules.
rejected:
  - >-
    refusing to load a ledger until it is valid — a broken ledger is exactly the
    one a user needs to look at, and refusing is a fence (inform-don't-fence)
  - >-
    a second set of validation rules inside the UI beside the check — two
    validators drift apart; one definition serves both (single-resolver)
  - >-
    a findings list with no place in the ledger — a finding the user has to go
    hunting for is a retrieval failure
links:
  domain: ui
context:
  why: >-
    "validation of a ledger itself... it should be able to find places where the
    ledger is invalid or malformed"; "it opens and shows what it can". Sharing
    the check's rules was a below-the-bar call. The rules themselves are not
    listed here: the methodology's records are the set (eng:enumeration-is-drift)
  src: ui product-tree session 2026-10-10 (user-directed)
