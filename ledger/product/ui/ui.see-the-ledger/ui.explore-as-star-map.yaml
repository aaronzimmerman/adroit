id: ui:explore-as-star-map
decision: >-
  A hierarchical decision tree is explored as one continuous space — fly around,
  click and drag, zoom in and out, like a star map. Within a tree, moving between
  the broad view and a single decision is motion in that space, never a jump
  between discrete pages.
rejected:
  - >-
    page-per-decision navigation — every click discards the surrounding context, and
    orientation has to be rebuilt from scratch on each landing
links:
  domain: ui
context:
  why: >-
    a mechanism-shaped product record where the mechanism IS the choice
    (eng:needs-not-mechanisms): continuous spatial exploration is itself the ruled
    experience of understanding — "I also want the fly around aspect... explore the
    decisions like a star map"
  src: ui product-tree session 2026-10-06
  revision: >-
    2026-10-07 (user-confirmed rescope): originally "the ledger is explored as one
    continuous space"; narrowed to the treatment of a hierarchical tree when the
    roots were ruled different enough for native treatments
    (ui:roots-get-native-treatments)
