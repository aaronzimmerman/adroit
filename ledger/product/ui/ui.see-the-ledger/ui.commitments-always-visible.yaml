id: ui:commitments-always-visible
decision: >-
  A record shows exactly its EFFECTIVE commitments — the inherited ones no less
  than the declared ones, each with its declaring record reachable. Below a
  negation the commitment simply is not there: those decisions no longer adhere
  to it, so nothing about it appears on them. A commitment's extent — where it
  was declared, which subtrees severed it — is read at the declaration and the
  negating records, never as residue on the descendants beneath.
rejected:
  - >-
    showing only what the record's own file declares — the whole point of an
    inherited commitment is that it binds where it is not written; hiding it there
    makes compliance a retrieval failure again
  - >-
    ghosted or struck-through tombstones below a negation — a severed commitment
    is not a fact about those records; it expresses a functionality requirement
    that must be considered until severed, and then no longer
links:
  domain: ui
context:
  why: >-
    "it carries the commitment through the tree — every decision in the hierarchy
    commits to it, until the tree reaches a negation... those child decisions
    would no longer adhere... considered throughout the product hierarchy until
    severed, and then no longer"
  src: ui product-tree session 2026-10-08; regeneration probe round two, finding seven
