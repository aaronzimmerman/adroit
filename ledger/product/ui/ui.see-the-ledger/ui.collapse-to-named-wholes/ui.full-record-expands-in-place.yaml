id: ui:full-record-expands-in-place
decision: >-
  The deepest zoom renders a decision's essentials — the rule itself, readable in
  the space, and its effective commitments, which are visible wherever the record
  is (ui:commitments-always-visible). The full weight of the record — long context, a ten-deep rejected
  list — stays folded behind a click that expands an overlay in place, over the
  map; revealing it never navigates away.
rejected:
  - >-
    the whole record as map copy at the deepest zoom — a copy-heavy record (ten
    rejected frameworks, a paragraph of context) is illegible rendered as canvas
    text, and most visits don't need it
  - >-
    a secondary detail view beside or instead of the map — reintroduces the
    discrete-page context break ui:explore-as-star-map exists to prevent
links:
  domain: ui
context:
  why: >-
    "we have to allow for a world where there's a bit of context required for a
    decision, which creates a pretty copy-heavy situation... some kind of overlay
    that's clicked to expand the full details or the full context"
  src: ui product-tree session 2026-10-06
