id: ui:surface-structural-skew
decision: >-
  The macro view is not a neutral rendering: it surfaces the interesting pattern in
  the structure without being asked — where the mass concentrates (most of a tree
  hanging under one child), where it thins out, where the shape is anomalous. The
  view's job is to make skew legible at a glance.
rejected:
  - >-
    neutral rendering that leaves pattern-finding to the user's eye — the pattern
    worth noticing is precisely the one the user did not think to look for
links:
  domain: ui
context:
  why: >-
    "I want to understand the macro structure in a way that reveals interesting
    patterns. If 90% of the decisions are under one child decision that is worth
    surfacing" — which measures count as interesting is deliberately unruled for now;
    the weights named in the walk (important, involved, sparse, controversial) were
    examples, not rulings
  src: ui product-tree session 2026-10-06
