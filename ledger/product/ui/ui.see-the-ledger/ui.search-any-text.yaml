id: ui:search-any-text
decision: >-
  Finding is a match on any text in the ledger, the whole ledger directory —
  decision text, rejected alternatives, context, a model's field names and
  pending entries, a capability contract's text, and ids themselves, which are
  searchable like any other text. There is no privileged id lookup; a pasted id
  finds its record because it matches, not because it is an id. Every hit shows
  what matched and where it lives in the hierarchy, and selecting one is travel:
  the view moves to the decision in the space.
rejected:
  - >-
    id or title lookup as the primary find — the user does not hold ids in their
    head; what they remember is the rule's words
  - >-
    search scoped to decision text only — the remembered phrase may live in a
    rejected alternative or a context note, and a model's field name is a legitimate
    way in
links:
  domain: ui
context:
  why: >-
    "match on the decision's key text, but I think we can just search on any of the
    text... and it all shows up with the context of where the match is found";
    selection-as-travel is ui:explore-as-star-map resolving the landing question
    before it was asked
  src: ui product-tree session 2026-10-06
