id: ui:change-shows-implications
name: Change shows implications
decision: >-
  When a user changes a decision, they see its implications at the moment of change rather than
  afterward: every node that depends on it.
questions: [How do the implications present?]
context: >-
  Stated at need level on purpose: "when a user changes a decision, they can see an implication of
  such a change".
