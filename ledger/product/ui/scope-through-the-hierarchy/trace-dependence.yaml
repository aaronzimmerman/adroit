id: ui:trace-dependence
name: Trace dependence
decision: >-
  At any node the user sees where it sits: the path down to it, each step selectable, and the
  parent's decision as the how this node refines.
rejected:
  - >-
    every ancestor's decision, and every capability included above, listed as binding the node — a
    decision answers how its parent works and informs only its own branch; nothing above governs
    downward
  - >-
    showing only the node's own decision — a node reads as a refinement of its parent, so the
    parent's decision is needed to read it
