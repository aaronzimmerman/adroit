id: ui:trace-dependence
name: Trace dependence
decision: >-
  At any node the user sees where it sits: the path down to it, each step selectable and showing its
  own decision on hover.
rejected:
  - >-
    every ancestor's decision, and every capability included above, listed as binding the node — a
    decision answers how its parent works and informs only its own branch; nothing above governs
    downward
  - >-
    the parent's decision written out above the node — it competes with the node's own decision; the
    path carries it, one hover away
context: >-
  "rather than 'A how of: …' lets add a hover state to each parent on the breadcrumb trail that
  shows just that decision text"
