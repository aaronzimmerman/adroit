name: Read-only code lens
decisions:
  - id: ui:read-only-code-lens
    decision: >-
      The UI has a read-only lens into the code: it never edits code, but reads facts about it.
    rejected:
      - >-
        the UI editing code as well — two-way traffic breaks the direction of authority: the ledger
        decides, the code complies, and the lens only reports
      - >-
        field-level usage declared in decision records — it leaks implementation vocabulary into
        rules and puts field decisions inside decision records; if field weight returns, it is
        measured from the built code, never declared
  - id: ui:lens-shows-what-changed
    decision: Through the lens a user sees what changed in the codebase because a decision changed.
  - id: ui:lens-shows-snippets
    decision: >-
      Through the lens a user reads code snippets in context, to see how the code works as a result
      of the decisions made.
context:
  why: >-
    "our UI can have a lens into the code itself... it's a one-way trip. Our UI doesn't edit the
    code, but it can consume information about it... even potentially showing code snippets in
    contexts to understand the nuances of how things are working as a result of decisions made" —
    the lens is the principle's measured-dependence surfaced on the code side of regeneration
  src: ui product-tree session 2026-10-07
  revision: >-
    2026-10-08: the cross-regeneration metrics comparison trimmed out — "want basic utility and then
    can build out more features on top of that". 2026-10-10: model-field usage weight trimmed out
    the same way ("skip model field usage for now") when the builder found its counting axis
    unruled. Both return, if they do, as future rulings with a live need behind them
