id: ui:read-only-code-lens
name: Read-only code lens
decision: >-
  The UI has a read-only lens into the code: it never edits code, but reads facts about it.
rejected:
  - >-
    the UI editing code as well — two-way traffic breaks the direction of authority: the ledger
    decides, the code complies, and the lens only reports
  - >-
    field-level usage declared in decision records — it leaks implementation vocabulary into rules
    and puts field decisions inside decision records; if field weight returns, it is measured from
    the built code, never declared
context: >-
  "our UI can have a lens into the code itself... it's a one-way trip. Our UI doesn't edit the code,
  but it can consume information about it... even potentially showing code snippets in contexts to
  understand the nuances of how things are working as a result of decisions made" — the lens is the
  principle's measured-dependence surfaced on the code side of regeneration.
