id: ui:edits-cast-suspicion
decision: >-
  Any edit to a decision record's content (its decision text, rejected list,
  links, commitments or context) casts suspicion across everything that depends
  on it: every
  refinement descendant and every consumer, meaning the records whose consumes
  links point at it, becomes suspect. Moving a record casts the same suspicion
  over the moved subtree, because a re-parent changes every descendant's ancestry
  and effective commitments without touching a field. Republishing a capability's
  contract casts suspicion on every record that consumes the capability, since
  the interface they honor changed. Model operations cast none: a model change
  always follows from a decision change, whose commit already cast it. Asking,
  answering or dropping a question casts none either: it leaves the rule as it
  was (eng:questions-hold-open-tension). The UI walks the user
  through the suspect set, reading, confirming or editing each one. The commit is
  NEVER gated: one decision lands as one atomic commit across every record it
  touches, and an expert can land it over an unworked set. That commit marks each
  unworked suspect DUBIOUS (ui:dubious-is-recorded), and the mark stays visible
  wherever the record appears until the record is read through and confirmed or
  edited.
rejected:
  - >-
    a hard gate holding the commit until the suspect set is worked — fencing the
    action for a trusted expert is what inform-don't-fence forbids; the guard is
    the dubious mark, information that outlives the commit instead of a door in
    front of it
  - >-
    a blocking confirmation on the load-bearing edit itself — fencing the gesture
    re-litigates it
  - >-
    pure inline information that evaporates at commit — a revised root silently
    landing over an unreviewed subtree, with nothing left behind, is exactly the
    attention failure the ledger exists to catch
links:
  domain: ui
  grounds: ["principle:scrutiny-follows-dependence"]
  consumes: ["change-propose"]
context:
  why: >-
    "labeling decisions as dubious for that kind of situation where there is
    reason to expect this is no longer coherent" — dissolves the probe-two
    gate-vs-fence contradiction: the commit stays free, the debt stays visible
  src: ui product-tree session 2026-10-08; regeneration probe rounds one and two
  revision: >-
    2026-10-10: rewritten whole when dubiousness became a recorded field; the
    commit now writes the mark rather than leaving it to be derived
