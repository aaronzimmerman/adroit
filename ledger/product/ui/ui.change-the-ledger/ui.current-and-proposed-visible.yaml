id: ui:current-and-proposed-visible
decision: >-
  The enduring two-state display belongs to the model layer: wherever a model or
  its fields appear, a pending change shows both states — deployed reality and
  ruled intent — until the migration lands, as the normal view, not behind a
  compare mode. A ruling's in-flight edits show as the working diff and vanish at
  commit; a committed ruling is one state, point in time, and the UI never renders
  a "proposed text" beside it.
rejected:
  - >-
    showing the projected result alone — the reader loses what the pending change
    costs, and a model field would claim a shape the store does not hold
    (adr:models-memorialize-deployed-shape)
  - >-
    enduring dual state for rulings too (this record's first form, 2026-10-08) —
    "when we make a ruling that is a point in time"; versioned ruling layers
    reintroduce the decision states the corpus rejected, and source control
    already carries a ruling's history
links:
  domain: ui
  consumes: ["change-propose"]
context:
  why: >-
    "model changes have to endure in pending state as a consequence of making a
    decision. The decision is committed atomically... and the result of that
    decision is a pending database change that has to exist in multiple states"
  src: ui product-tree session 2026-10-08
