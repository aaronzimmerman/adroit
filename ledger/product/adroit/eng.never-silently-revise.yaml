id: eng:never-silently-revise
decision: >-
  A request to build something is never permission to rewrite a standing decision. When the work
  appears to contradict a live record, the work stops: the old rule and the proposed new one are
  stated side by side and the change waits for explicit confirmation. How much the confirmation
  must cover is measured from the graph — the record's refinement children and consumers are named
  before anything changes — so leaves change cheaply and load-bearing records carry their
  dependents into the question.
rejected:
  - >-
    revising in place whenever the new request is clearly better — "clearly better" is the agent's
    inference about intent, which is exactly the assumption the ledger exists to stop
  - >-
    uniform ceremony for every change — guarding a leaf like a load-bearing root makes leaves
    expensive and dulls the guard where it matters
links:
  domain: eng
context:
  why: >-
    decisions endure only if a later request cannot quietly overwrite them; stated in adroit's
    CLAUDE.md protocol with no record holding it. The dependence measure mirrors StageDoor's
    principle:scrutiny-follows-dependence, which stays downstream and is cited here in prose only
  src: CLAUDE.md walk, adroit-ledger-upstream migration 2026-09-28
