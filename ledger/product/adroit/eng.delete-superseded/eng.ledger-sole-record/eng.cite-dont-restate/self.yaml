id: eng:cite-dont-restate
decision: >-
  The ledger is the single point of decision tracking; every other artifact is an undesirable
  home for decision content. A code comment, CLAUDE.md section, README, task file or commit
  message CITES a decision by its id and may add only local implementation hints — what the
  thing at hand does toward the rule, the mechanism, the constraint being honored. It never
  restates the rule's content or rationale: a restated decision is a second copy that drifts
  invisibly when the record changes, while an implementation hint drifts visibly with the code
  it sits beside. Declared registries whose descriptions are their own load-bearing content
  (the mail catalogue's trigger text) are the registry's facts, not restatements.
rejected:
  - >-
    decision text mirrored into comments — seven archive endpoint comments restated one rule's
    old text and all went stale in unison when the record was revised (swept 2026-09-28)
  - >-
    CLAUDE.md or a README as a parallel decision store — a second description of the system is
    the thing the ledger exists to eliminate
  - >-
    bare ids with no gloss at all — a reader owes one clause of what the code does toward the
    rule; the id points at the rest
links:
  domain: eng
  module: ledger
context:
  why: >-
    user-directed 2026-09-28: "the ledger is the single point of decision tracking, any other
