id: eng:read-ledger-in-full
decision: >-
  Work that could bear on a decision starts by reading the whole ledger — one compact line per
  record — and keeps it in view as the working constitution, so that violating a decision is an
  attention failure a review can catch rather than a retrieval failure nobody sees. Detail below the
  decision is read from the code and its tests; there is no second description to consult.
rejected:
  - >-
    searching the ledger for the records a task seems to touch — the decision that gets violated is
    the one the task did not seem to touch
  - >-
    a curated summary loaded in place of the records — a second description, drifting from the one
    it summarizes
links:
  domain: eng
context:
  why: >-
    the methodology's core bet, stated in adroit's CLAUDE.md intro and protocol with no record
    holding it; the dump tool exists to make this one read cheap
  src: CLAUDE.md walk, adroit-ledger-upstream migration 2026-09-28
