id: eng:stories-not-interfaces
decision: >-
  A user story states what the user needs to do — never the interface. The interface is emergent:
  the realization of the stories under the standing engineering decisions, open to refactoring as
  either side evolves. A UX change is made by finding the property of the product or engineering
  graph that makes the current output wrong and changing THAT decision — never by specifying a
  screen directly. This is how the product stays coherent: every surface is a derivation from the
  same graph.
rejected:
  - >-
    story records that name screens, buttons, or layouts — a story that dictates UI freezes the very
    output the graph exists to derive
  - >-
    one-off UX fixes outside the graph — the fix decays into incoherence at the next derivation,
    because nothing upstream produces it
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    user-directed in the story-tree remodel — the region prominence and one-step-switch changes both
    worked this way (the fix was a graph property,
    eng:prominence-follows-dependence/eng:one-step-reversible, not a screen spec), so the working
    method becomes the rule
