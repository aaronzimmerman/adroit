id: eng:needs-not-mechanisms
decision: >-
  A product decision states what the user needs to do, not how the app works. A record
  that describes a mechanism — how a screen behaves, what an engine computes, what a
  component does — is a smell: either it is evidence for a user need that should be the
  record instead, or it belongs in engineering. Mechanism-shaped product records are
  allowed only where the mechanism IS the choice and the record says why; a walk that
  meets one asks first what need it serves.
rejected:
  - >-
    product trees built from mechanisms (the shape a tree inherits from a code survey or
    a backfilled spec) — a pile of how-it-works records hides what the user is trying to
    do, and leaves no place to ask whether the mechanisms still serve it
  - >-
    banning mechanism records outright — sometimes the mechanism genuinely is the product
    choice; the rule is suspicion and a stated reason, not prohibition
links:
  domain: eng
context:
  why: >-
    ruled 2026-10-05 (user-directed, StageDoor tasks/099 dashboard walk), on finding the
    scheduler's records hanging from "scheduling is manual-first on a calendar" with no
    need above them: "mechanisms are a code smell. If the decision is describing how the
    app works, that is suspicious... it should be about what the user needs to do. That's
    the product decisions." Broadens eng:rules-not-implementation (no implementation
    names) to the shape of the decision itself
  src: StageDoor tasks/099 walk session 2026-10-05
