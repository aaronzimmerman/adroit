id: eng:decision-per-file
decision: >-
  Each decision is its own file in the ledger tree. A record's fields are id,
  decision, rejected, links, context, the optional COMMITMENTS, the optional
  DUBIOUS mark and the optional QUESTIONS; nothing else, and in particular no
  lifecycle status and no search keywords. The CORE is the rule, its typed
  links, its REJECTED alternatives (required, so an empty list is visible) and
  its COMMITMENTS, atomic standing declarations that bind the record's subtree
  (eng:commitments-endure-until-canceled). DUBIOUS is a condition, not a ruling:
  present with one line of reason while the record is suspected of no longer
  being coherent, absent otherwise (ui:dubious-is-recorded). QUESTIONS are the
  open tensions the decision carries, not rulings either
  (eng:questions-hold-open-tension). The CONTEXT block
  (rationale, provenance, revisions) is never load-bearing. Exploration happens
  only in a derived graph the tooling rebuilds from the files; the files exist
  for git (diff, merge, blame, review), and an id claim is a file path, so
  parallel claims are merge conflicts git refuses to hide.
rejected:
  - one appended ledger file (line merges hide ID collisions and every session edits the same file)
  - a binary database as the canonical store (unmergeable, undiffable)
  - >-
    a lifecycle status field on every record — superseded records are deleted,
    not marked, so it could only ever hold one value; a field that cannot vary
    states nothing. The dubious mark is not this: it varies, it clears, and it
    says why
  - >-
    curated search tokens on every record — they duplicated what the id, decision and rejected text
    already say, fed only a related-by-token panel and a search filter, and were one more field to
    write and keep in step
  - >-
    an api flag on a record (a per-record boolean tag outside the schema) — whatever it marked, a
    typed link (consumes) or the statement itself carries better, and the boundary it once licensed
    is now the one-way direction rule
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    user-directed via inbox 006 — context and rationale must ride alongside the decision without
    being part of it, links must be structured rather than prose, and the quality bar (name what you
    rejected) becomes schema instead of taste; revised 2026-09-28 by the user to simplify and
    streamline the schema to the fields that carry the decision
  src: decisions/inbox/006-ledger-directory.md; session 2026-09-22; schema slimming 2026-09-28
  area: platform
  revision: >-
    four-roots (2026-09-24): "one root ledger directory" became the tree. Schema
    slimming (2026-09-28): status and tokens dropped and the field list became the
    rule; the api flag followed the same day. Commitments (2026-10-08,
    user-directed): the list gained optional commitments. Dubious (2026-10-10,
    user-directed, "make it a field after all"): the list gained the optional
    dubious mark. Rewritten whole at that point (eng:rewrite-over-patch).
    Questions (2026-10-10, user-directed): the list gained optional questions.
    Dependents named at each revision: model:record, the change-propose
    contract's edit-field set, the check, this repo's CLAUDE.md field list, and
    every adopting corpus's check
  demoted: >-
    grounded on principle:derive-dont-materialize while this corpus lived in StageDoor's ledger; that principle stayed
    downstream when the corpus moved upstream (2026-09-28), so the edge demoted to this note
    (adr:references-flow-one-way — a relationship the direction forbids demotes to context)
