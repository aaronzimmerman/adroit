id: adr:principles-are-ambient
decision: >-
  A principle is implicitly connected to every decision: it binds every record of its own corpus
  and of every corpus that adopts the methodology, with no link required for it to apply. A
  grounds citation of a principle is optional emphasis — it marks where the principle did the work,
  never where it starts applying. The check treats a principle id in a link as ambient vocabulary:
  it never dangles, including when the principle lives in the upstream corpus, and it never
  crosses a boundary.
rejected:
  - >-
    required grounds bookkeeping — making a principle bind only the records that cite it implies
    that an unlinked decision is exempt from it, which is false: a principle is a value judgment
    about the whole system, and a missing link is an omission, not an exemption
  - >-
    demoting a cross-corpus principle citation to prose — it loses the citation's referability
    (the explorer, impact and the dump stop seeing it) for no gain, since an ambient principle
    cannot dangle; this retires the demoted-to-context workaround the upstream migration used for
    principles
links:
  domain: adr
context:
  why: >-
    user ruling 2026-09-28 verbatim: "principles of adroit or engineering principles should be
    implicitly connected to every other decision." Makes the methodology's own principles movable
    upstream without breaking the adopting corpus's citations of them. Trade-off accepted: a
    typo'd principle id in a link is no longer caught by the check
  src: user ruling 2026-09-28; StageDoor branch principles-ambient
