id: eng:rejected-proves-deliberation
decision: >-
  The rejected block is the mechanism that lets a ruling survive scrutiny without its
  authors' context: a rule that defies a fresh reader's instinct MUST name the
  alternatives it beat, and context.why must carry the reasoning — because a reader
  cannot distinguish "considered and rejected" from "never thought of it", an empty
  rejected on a surprising rule reads as an oversight and invites re-litigation by every
  future reader. The more counterintuitive the ruling, the more load-bearing its losers.
rejected:
  - >-
    rejected as optional provenance trivia — zero-context regeneration is the bar, and
    the losing options are what defend a ruling at that bar
  - >-
    an empty rejected on contentious rulings with the reasoning held in the session that
    made them — that context dies with the session; the record is where it survives
links:
  domain: eng
context:
  why: >-
    ruled 2026-10-03 (user-directed, StageDoor tasks/099 walk): a zero-context probe
