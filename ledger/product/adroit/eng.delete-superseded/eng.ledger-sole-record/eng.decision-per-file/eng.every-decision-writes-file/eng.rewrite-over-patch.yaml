id: eng:rewrite-over-patch
decision: >-
  A record that has been patched more than twice is REWRITTEN WHOLE: successive
  string-splices accrete sediment — clauses grafted onto sentence structure written
  for earlier versions of the rule — until a record carries sentences that contradict
  each other, each true when written, never composed together. Editing mechanics
  follow the same honesty: every programmatic edit verifies its anchor matched and
  its result landed, or it did not happen (an unmatched replace fails silently; an
  aborted batch leaves earlier edits applied and later ones not); and the work log
  records VERIFIED results, never the plan — logging intended edits as done is how
  two phantom fixes shipped twice.
rejected:
  - >-
    patch-forever editing — the connect-overrides record accreted six splices across
    three days and ended self-contradictory; nobody composes an accreted record
  - >-
    unverified batch edits with a summary log written from the plan — the failure
    mode is silent and the log actively lies
links:
  domain: eng
context:
  why: >-
    distilled 2026-10-03 from StageDoor's tasks/099 walk: three separate probe rounds
