id: adr:capability-names-no-product
decision: >-
  A capability's records and contract speak only the capability's own vocabulary and never name a
  product surface. How a product uses the capability is stated in the product's consuming record,
  never inside the capability.
rejected:
  - >-
    capability records that name the product screens they serve — the prose points back up the
    direction the links may not, and the capability can no longer be understood or reused without
    that product
links:
  domain: adr
context:
  why: >-
    stated in adroit's CLAUDE.md ("The tree") with no record holding it; the prose counterpart of
    the one-way direction rule, which the check can only enforce on links
  src: CLAUDE.md walk, adroit-ledger-upstream migration 2026-09-28
