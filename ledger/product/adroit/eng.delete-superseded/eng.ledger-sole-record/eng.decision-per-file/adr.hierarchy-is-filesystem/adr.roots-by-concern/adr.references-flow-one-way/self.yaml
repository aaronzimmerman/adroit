id: adr:references-flow-one-way
decision: >-
  References flow ONE WAY: product → capability → engineering; capabilities among themselves one
  way and acyclic, like library dependencies; principles citable from anywhere. Nothing points
  back, sideways into another product, into the tool’s corpus, or at the models directory — a model
  cites the decisions it realizes, and no decision names a model or view. A relationship the
  direction forbids is not an edge — it demotes to context (provenance, background). Grandfathering
  a violation is a recorded ruling in a ratcheted baseline that warns every run, never a quiet
  append.
rejected:
  - >-
    per-record waivers legalizing individual crossings — the boundary drifts to wherever the waivers
    accumulate
  - >-
    sideways product-to-product edges for genuinely shared semantics — the shared thing is a
    capability; naming it is the fix, referencing across is the symptom
  - >-
    decisions consuming models and views as the layer between capabilities and engineering (this
    record's form until 2026-10-10) — it made rulings depend on the implementation's deployed shape;
    the direction between decision and model is model → decision only
links:
  domain: adr
context:
  why: >-
    rulings 7, 11 and 13: capability-to-capability blessed one-way; admin reaches other products
    only through models; every last sideways edge dissolved into an established pattern rather than
    an exception
  src: >-
    decisions/inbox/009-four-roots-structure.md (landed as PR #41); session 2026-09-23/24; user
    messages 61-89 verbatim in tasks/082-user-notes.md; StageDoor tasks/099 2026-10-10
  revision: >-
