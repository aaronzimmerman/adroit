id: adr:roots-by-concern
decision: >-
  The store is a small set of roots, one per kind of concern: an engineering commons every tree may
  cite; CAPABILITIES — named, self-contained trees a product buys into; one PRODUCT tree per
  application, its story at the root. Beside them sits the MODELS directory, which is not a decision
  tree: it describes the at-rest models and views of the current implementation, its fields cite the
  decisions they realize, and no decision ever references it — it lives in the ledger directory so
  one place holds everything the tooling and its readers browse. The tool’s own corpus is not a root of any instance: it lives upstream, in
  the tool’s repository, separate from the instances it governs. Where a record lives determines
  what it may reference; there is no placement a path cannot express.
rejected:
  - >-
    modules as metadata files beside a flat store — forty declarations whose layers, exports and
    imports could disagree with the traffic, and did
  - >-
    one tree for everything — engineering rules, product choices and reusable machinery answer to
    different consumers and different disruption tolerances
  - >-
    models as a decision root "owned by nobody and citable by everybody" (this record's form until
    2026-10-10) — decisions citing models coupled business rulings to the implementation's
    deployed shape; the model is the realization of decisions, so it cites them and never the reverse
  - >-
    moving the models directory out of the ledger directory — it is not decision content, but the
    tooling and its readers browse one directory, and the field-to-decision citations live there
links:
  domain: adr
  grounds: ["principle:weigh-disruption"]
context:
  why: >-
    at full disruptability the mandate is to consider upending the entire hierarchy for a better
    organization — this structure is that mandate obeyed (greenfield StageDoor, 14 rulings, zero
    sideways edges at the end)
  src: >-
    decisions/inbox/009-four-roots-structure.md (landed as PR #41); session 2026-09-23/24; user
    messages 61-89 verbatim in tasks/082-user-notes.md
  revision: >-
    2026-09-28 (user-directed): the tool's corpus stopped being an instance root when adroit's
    decisions moved upstream; adr:four-decision-roots states the resulting directory shape. The
    same day the grounds on principle:weigh-disruption, demoted to a context note by the move, was
    restored as a link once the principle moved upstream too and principles became ambient
    (adr:principles-are-ambient). 2026-10-10 (user-directed, StageDoor tasks/099): models stopped
    being a citable decision root — "There is no record in the ledger that should have a pointer to a model. The ledger must be
    business decisions only... The model points to a decision; the decision never points to a
    model." And: "There is no reason to move the folder out of the ledger. It is functionally not
    part of the decision ledger, but it is part of the adroit tooling... the ledger guidelines treat
    the models directory differently. It is not a decision tree, but a description of the at-rest
    models and the views. We also don't want to get rid of the pending logic."
