id: adr:roots-by-concern
decision: >-
  The store is a small set of roots, one per kind of concern: an engineering commons every tree may
  cite; CAPABILITIES — named, self-contained trees a product buys into; MODELS — flat contracts for
  data at rest, owned by nobody and citable by everybody; one PRODUCT tree per application, its
  story at the root. The tool’s own corpus is not a root of any instance: it lives upstream, in
  the tool’s repository, separate from the instances it governs. Where a record lives determines
  what it may reference; there is no placement a path cannot express.
rejected:
  - >-
    modules as metadata files beside a flat store — forty declarations whose layers, exports and
    imports could disagree with the traffic, and did
  - >-
    one tree for everything — engineering rules, product choices and reusable machinery answer to
    different consumers and different disruption tolerances
links:
  domain: adr
