id: adr:models-flat-views-derived
decision: >-
  A model is FLAT — the shape of the data at rest, a contract other actors buy into, with no
  decision tree beneath it. Shared DERIVED semantics live in a VIEW: a flat read contract over one
  or more models whose fields are each defined once; read-only by construction — mutation decisions
  stay with their actors — and minted only on MEASURED sharing, when a second consumer needs the
  same derivation. One consumer’s derivation stays that consumer’s own decision on its model
  reference.
rejected:
  - >-
    decision trees under models to hold shared semantics — the model stops being a contract and
    becomes another product tree
  - >-
    each consumer carrying its own copy of a shared derivation — copies drift; the expiry predicate
    shipped twice with opposite mechanisms
  - a behavioral capability owning a model’s lifecycle — the mutation decisions belong to the actors
links:
  domain: adr
context:
  why: >-
    user, rulings on the notice seam: models define shape at rest; the gap was derived fields
    needing one consistent definition across actors; the caution stands — simplicity and purity of
    concept at the heart, concepts emerge organically, be conservative about new exceptions. Proving
    instance: view:listing-public
