id: adr:fields-link-their-rulings
decision: >-
  The ruling ids a shape field cites are LINKS, not prose: a model is the realization of
  problem-solving, so each field points at the decisions it realizes, and the tooling treats
  those citations as first-class edges — every cited id must resolve, the edges count in the
  dependence graph (a ruling's field links show the migration surface of changing it, so
  change-weight is visible before anyone proposes the change), and a deployed field with NO
  governing link is surfaced as a probable orphan: nothing decided it, so it probably is not
  needed. The orphan signal is a report for the next walk, never a validation failure — plumbing
  like a created-at timestamp legitimately answers to no ruling, and forcing a citation onto it
  would corrupt the very signal the empty link carries. Direction stays one-way: the model cites
  the decision; a decision never names a model, a view or a field, which it must outlive.
rejected:
  - >-
    decisions linking into model fields (the earlier resistance, resolved 2026-10-07) — reversed
    direction couples a ruling to deployed columns; models-as-output makes the model the citing
    side, downstream of the problem-solving it memorializes
  - >-
    a structured per-field links block instead of the in-grammar citation — the id is already in
    place in the field line; a second structure would say the same thing twice and drift
  - >-
    unlinked fields as a check FAILURE — timestamps and plumbing would force noise citations,
    and noise citations destroy the orphan signal
links:
  domain: adr
context:
  why: >-
    ruled 2026-10-07 (user-directed, StageDoor models-root rework): "I'd resisted this before but
    I think the directionality and models as output resolves it. The model field links to the
    decisions that govern it. The models don't exist in a vacuum. They are the realization of a
    problem solving... utility in terms of not wanting to change things with lots of links. We
    can also then see times where an existing field has no links which means it probably isn't
    needed"
  src: StageDoor tasks/099 session 2026-10-07
