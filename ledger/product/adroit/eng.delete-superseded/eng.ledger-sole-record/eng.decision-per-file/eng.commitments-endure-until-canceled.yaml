  why: >-
    "a commitment has four attributes: ID and description at the root level; then
    child decisions can have adherence and negation, both by ID, negation just a
    flag" — the unified vocabulary, confirmed 2026-10-08, folding the deviations
    record (adr:deviations-ride-commitments, deleted) into this one; born across
    two sessions the same day: the StageDoor hub pass supplied co-location, lens
    views and the parallel-tree loser, this session supplied the id handle,
    atomicity and one-way negation
