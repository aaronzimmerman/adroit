id: eng:decision-states-the-present
decision: >-
  The decision field states only the current de facto rule. No dates, no SCOPE or
  revision annotations, no "previously X, now Y" narrative: when a ruling changes
  or narrows, the decision is rewritten whole to read as if it had always been
  so. History embedded in a decision is a second archive that drifts; revisions
  live in context, supersession lives in git.
rejected:
  - >-
    dated scope clauses spliced into live decision text (the proving instance: a
    SCOPE paragraph added to a record the same day it was minted) — the reader of
    law needs the law, not its diffs, and the splice reads as load-bearing
    forever
  - >-
    keeping old wording with transitional clauses for reader continuity — the
    continuity a reader needs is in context.revision and git blame, where it
    cannot masquerade as rule
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    "this is the kind of stuff we have to avoid. A decision can't have history
    embedded. It is just the current de facto decision" — caught live on
    eng:changes-are-projectable's cross-session SCOPE splice; the write-side
    counterpart of eng:rewrite-over-patch's sediment rule
  src: ui product-tree session 2026-10-08 (user-directed)
