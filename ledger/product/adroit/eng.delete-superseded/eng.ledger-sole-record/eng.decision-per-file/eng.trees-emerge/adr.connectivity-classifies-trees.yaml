id: adr:connectivity-classifies-trees
decision: >-
  The classifier is the connectivity spectrum, MEASURED never ascribed: connected to everything is
  engineering; connected to SOME trees is a capability; connected to nothing beyond its own
  refinement chain is product. The measurement NOMINATES — a promotion, a demotion, a move — and a
  human blesses. The contract shape may overrule a temporally thin measurement (one consumer today,
  a foreseeable second tomorrow), and that overruling is itself a recorded ruling.
rejected:
  - >-
    layer declarations on metadata files — the ascription the spectrum replaces; extraction-engine
    was declared shared and measured product
  - >-
    thresholds acting automatically on fan-in counts — the payments call went against the raw count,
    on judgment the graph cannot see
links:
  domain: adr
context:
  why: >-
    the user’s rule stated during the design (message 63) and exercised in rulings 1, 8 and 9:
    identity promoted on measurement, extraction-engine demoted on measurement, payments kept a
    capability against the raw count
