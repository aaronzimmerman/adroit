id: eng:trees-emerge
decision: >-
  A tree is never ascribed — it emerges from the decisions that cluster to support a story. A new
  story is placed by the connections it brings, and a record MOVES when its connections say it grew
  up somewhere else: needing another tree’s decisions is the signal, and re-homing is the normal,
  healthy response, not a failure. The graph adjusting — a story splitting into its own tree, a
  cluster promoting to a capability, a feature migrating to the tool it actually lives in — is the
  system working.
rejected:
  - >-
    a fixed taxonomy that records are filed into — the taxonomy becomes the wrong map the first time
    a story’s connections disagree with it
  - >-
    pinning a feature to the tool that first hosted it — the cast graphic was assumed into the
    casting tool (the natural output: we made a cast, tell the world) until its connections showed
    the rehearsal dashboard is where a cast ALWAYS exists, with or without the casting tool
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    user-directed during the story-tree remodel rulings: the batch of 17 module moves, the
    engineering/growth splits, and the cast:shareable-cast-list-graphic placement were all this one
    rule applied — an engineer already handles this tension by feel; the graph makes it visible and
    mandatory
  src: decisions/inbox/008-story-tree-remodel.md; session 2026-09-22
  revision: >-
