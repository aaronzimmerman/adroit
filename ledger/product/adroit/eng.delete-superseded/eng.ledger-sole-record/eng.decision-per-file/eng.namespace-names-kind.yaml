id: eng:namespace-names-kind
decision: >-
  Every id is a namespace and a slug. The SLUG names the decision’s substance — its rule, not its
  category, in a few kebab-case words — so a reader seeing only the id can guess the rule’s gist;
  ids are never numbered, and a new one is claimed by choosing a descriptive slug unique across the
  corpus (the file path is the claim, so a collision is a merge conflict). The NAMESPACE is looked
  up, never inferred from shape: a prefix that names a CAPABILITY TREE marks one of that
  capability’s records; the reserved kind namespaces — principle, story, model, view — are
  graph-level records any record may cite, because being cited from everywhere is their purpose; and
  a DOMAIN namespace, declared in the ledger with the line saying what it covers, marks an ordinary
  decision of that part of the system. A new namespace must be an existing capability, a reserved
  kind, or a declared domain before records may use it.
rejected:
  - >-
    the id-shape heuristic (any x:y is module-scoped) — it broke the day a second kind of namespaced
    id existed
  - >-
    a hardcoded ignore-list in the validator — the set of kinds is ledger content, not tooling
    content
  - >-
    numbered ids (a domain prefix plus the next unused D number) — a number says nothing about the
    rule, so every citation was an opaque lookup, and claiming the next number raced across parallel
    sessions
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    found live during inbox 008: story: and model: ids tripped the module export contract by
    accident of shape; the implementing agent surfaced the collision rather than silently redefining
    isModuleScoped — the rule keys on declared modules so future kinds cannot collide
  src: decisions/inbox/008-story-tree-remodel.md; session 2026-09-22
  revision: >-
    four-roots (2026-09-24): declared modules retired; the lookup target is now the capability
    trees, and view joined the reserved kinds (ruling 12); slug ids (2026-09-25, user-approved):
    every numbered id became a domain-prefixed slug named from its rule, the domains are declared in
    ledger/domains.yaml, and tools/adroit/id-map.json translates the old ids for anyone reading
    history
  demoted: >-
    grounded on principle:single-resolver while this corpus lived in StageDoor's ledger; that principle stayed
    downstream when the corpus moved upstream (2026-09-28), so the edge demoted to this note
    (adr:references-flow-one-way — a relationship the direction forbids demotes to context)
