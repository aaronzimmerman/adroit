id: eng:inbox-item-lifecycle
decision: >-
  A proposed decision change is a filed work item with an audited lifecycle — filed, scoped against
  the graph's computed blast radius, questioned when ambiguous or contradictory, then landed as ONE
  change of decision, code, and bound tests together, or withdrawn. Questions and outcome live on
  the item while it is open; once landed or withdrawn the item is DELETED — the resulting decision's
  why/src carry the context, and git history is the archive.
rejected: []
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    editing the constitution in place leaves no room for the scoping and questioning a change needs
    before it becomes law, and no record afterward of whether the graph predicted the work
  src: tasks/082 adroit pilot; session 2026-09-21 (user-directed)
  area: platform
  demoted: >-
    grounded on principle:audit-memorialize while this corpus lived in StageDoor's ledger; that principle stayed
    downstream when the corpus moved upstream (2026-09-28), so the edge demoted to this note
    (adr:references-flow-one-way — a relationship the direction forbids demotes to context)
