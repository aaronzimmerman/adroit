    user-directed via inbox 007 — the ledger must be an active document refined by evidence: which
    decisions keep earning their keep, which are missing, measured by the moments the graph changes
    the stream rather than by citation volume; revised 2026-09-28 (user): "this is metadata about
    adroit usage, like a log file" — the events moved out of git to a machine-local log
  src: decisions/inbox/007-interaction-audit.md; session 2026-09-22; interactions-local-log 2026-09-28
