id: eng:dependencies-must-resolve
decision: >-
  Every declared decision dependency must resolve. A boundary is crossed only in the directions the
  structure grants — the one-way reference rule — never through a per-record waiver.
rejected:
  - >-
    per-record export marks licensing individual cross-boundary references — the boundary drifts to
    wherever the waivers accumulate
  - >-
    pilot sub-ledgers whose records live decisions may not depend on — a capability is a first-class
    tree, not a pilot
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    an unchecked or internal target makes impact analysis look complete while silently omitting the
    contract it relies on
