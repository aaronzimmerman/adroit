id: eng:adroit-separate-corpus
decision: >-
  Adroit's own decisions — how decision systems work: the encoding, the lifecycle, the audit, the
  classifiers — form a separate corpus from any application's, and it lives in adroit's own
  repository. An adopting application's ledger holds that application's decisions, including its
  rulings about its own ledger practice, never adroit's: it cites adroit's ids in prose and never
  links to them, and nothing in adroit's corpus links down into an application.
rejected:
  - >-
    filing adroit's rules under the application's engineering tree — they would ship with
    StageDoor's stack and vanish from the next application's
  - >-
    cohabiting the application's repository — the convenience the pilot ran on, but it left
    adroit governing one project's ledger rather than its own; the load test is adroit run on
    itself (user, 2026-09-28)
  - >-
    adroit's principles as universally citable across the boundary — once the corpora live in
    separate repositories a cross-repo link cannot be checked, so a principle one side needs is
    cited in prose (the StageDoor principles this corpus leaned on stayed downstream)
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    user-directed 2026-09-23 (message 67): principles of adroit-development like the four roots
    don't belong as part of StageDoor — cohabit for convenience, coupled only in so far as the
