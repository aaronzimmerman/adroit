id: eng:probe-the-regeneration-bar
decision: >-
  A tree's sufficiency is tested by a REGENERATION PROBE: a fresh agent with no
  session context reads ONLY the tree under test, the capability contracts and models
  it cites, and the corpus's ENTIRE ambient principles layer — never a curated
  subset, since curation is exactly the hidden context being tested away. The prompt
  declares, as givens rather than gaps: facts ruled outside the tree, neighboring
  trees as black boxes, and the tree's declared design latitude. Framing stays
  neutral — "report exactly as many questions as you find", never a nudge toward
  empty or toward thoroughness — and the probe reports where two engineers would
  build observably different products, plus contradictions between records. Expect a
  trajectory: early rounds find real gaps and mine missing PRINCIPLES (whole
  question classes dissolving at once); later rounds catch boundary refinements of
  fresh rulings and the editors' own defects. When findings turn predominantly
  editorial, the probe loop is done — a capable agent always finds something, so the
  instrument has a floor and "empty" may never arrive; severity converging to the
  floor is the real signal.
rejected:
  - >-
    curating which principles the probe sees — the author's selection is session
    context smuggled back in, and it suppressed real findings until caught
  - >-
    outcome-nudged framing ("say none if sufficient" or "don't go easy") — the
    question count swung threefold on framing alone; only neutral counts compare
    across rounds
  - >-
    probing until empty — chasing zero re-litigates declared latitude and measures
    the prober, not the tree
links:
  domain: eng
context:
  why: >-
    distilled 2026-10-03 from StageDoor's tasks/099 run-auditions walk: seventeen
    probes drove two architecture walk-backs, seven ambient principles, and three
