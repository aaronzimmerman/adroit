id: eng:ledger-sole-record
decision: >-
  There is ONE record of what was decided, and it is the ledger. The prose specification that
  preceded it is deleted outright rather than frozen as reference: a second description of the same
  system drifts from the first, and a frozen one is the worst case — detailed enough to be believed,
  no longer maintained enough to be right. A test binds to a decision or to nothing; the
  per-behaviour catalogue that only the prose defined goes with it, because what a test guards is
  proved by breaking the code, not by citing a paragraph.
rejected: []
links:
  domain: eng
  module: ledger-authoring
context:
  why: >-
    a frozen directory is a tombstone at the scale of a whole system, and the same reason we never
    retire a record in place applies to 1.3MB of them: a reader who finds the stale half cannot tell
    it from the current one. The behaviour ids it alone defined bound 935 test annotations to prose
    nobody would update again, which is coverage asserted rather than demonstrated.
  src: session 2026-09-21 (user-directed)
  area: platform
  demoted: >-
    grounded on principle:single-resolver while this corpus lived in StageDoor's ledger; that principle stayed
    downstream when the corpus moved upstream (2026-09-28), so the edge demoted to this note
    (adr:references-flow-one-way — a relationship the direction forbids demotes to context)
