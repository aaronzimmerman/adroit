id: story:adroit
decision: >-
  A user can make decisions that endure and create a single hierarchy of reference for agents and
  humans to reference while adding features.
rejected:
  - >-
    decisions kept where the work happened (tickets, threads, design docs per feature) — nothing
    places a new decision against the old ones, so each feature re-litigates what the last one
    settled
  - >-
    a decision log looked up on demand — the agent never retrieves the rule it is about to break;
    a violation stays a retrieval failure instead of becoming an attention failure
links: {}
context:
  why: >-
    adroit governs ledgers more than it has one — using it on itself is the test. The methodology's
    structural rulings (the roots, the contract artifact, slug ids, cite-don't-restate) refine this
    story rather than sitting in a practice annex beside some other product
  src: user ruling 2026-09-28 (decision text verbatim from the user); StageDoor branch adroit-ledger-upstream
