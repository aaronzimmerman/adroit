id: principle:single-resolver
name: Single resolver
decision: >-
  One rule, one place — a rule that recurs is defined once (one resolver, one predicate, one
  registry) and every consumer routes through it; never a parameter that changes the rule.
context: >-
  Duplicated rules diverge silently — one name meaning two durations, hand-copied predicates
  drifting, second-copy bugs invisible to every gate.
