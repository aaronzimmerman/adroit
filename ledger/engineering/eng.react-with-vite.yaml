id: eng:react-with-vite
decision: >-
  The DOM surfaces are built in React and the project builds with Vite. The canvas
  renderer stays framework-agnostic; React owns only the prose surfaces around it.
rejected:
  - >-
    Svelte or another capable framework — nothing wrong with them; they lost on one
    criterion: the builder here is a coding agent, and the boring pair is the one
    agents know cold
  - >-
    no framework at all — the map needs none, but overlays, forms and search results
    are cheap in a framework and expensive without one
links:
  domain: eng
context:
  why: >-
    baseline blessed on recommendation, chosen for builder-agent familiarity over
    taste
  src: ui engineering session 2026-10-08
