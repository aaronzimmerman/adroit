name: Typescript end to end
decisions:
  - id: eng:typescript-end-to-end
    decision: "The UI is TypeScript end to end: one language for the server and the view."
    rejected:
      - >-
        different languages per side — the record shape would be declared twice, and the two
        declarations drift exactly the way duplicated decisions do
      - >-
        untyped JavaScript — the whole product is the handling of one structured shape (the node);
        forgoing types on it discards the cheapest check available
  - id: eng:shapes-typed-once
    decision: The node and model shapes are typed once and shared across the server-view boundary.
context:
  why: >-
    baseline blessed on recommendation — the user ruled the baseline open to recommendation, with
    opinions reserved for methodology and practice
  src: ui engineering session 2026-10-08
