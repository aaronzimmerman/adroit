id: eng:thin-server-owns-files
decision: >-
  A thin local server owns every read and write of the ledger's files and all the
  facts beside them — git operations and the code lens. The browser is a pure view:
  it never touches the disk, and everything it shows arrives from the server.
rejected:
  - >-
    a browser-only app on the File System Access API — no git, no code-lens
    measurement, and the ledger's single write path would live inside whichever
    browser grants the permission
  - >-
    a fat client that owns ledger logic with the server as a dumb pipe — the
    decision-edit contract's validation would live on the wrong side of the
    boundary, unenforceable at the single write path
links:
  domain: eng
context:
  why: >-
    the ledger files are the system of record, so their one write path belongs where
    git and the code live; precedent is the prior dump/check/server toolchain
  src: ui engineering session 2026-10-08
