name: One step reversible
decisions:
  - id: eng:one-step-reversible
    decision: >-
      Interactions are streamlined: a non-destructive, easily-reversed action takes effect in one
      step — no confirming second control. Multi-step flows exist only where the task itself has
      steps; destructive or hard-to-reverse actions keep their confirmation.
context:
  why: >-
    requiring a select plus a second confirm button is two steps for an action that costs nothing to
    reverse
  src: adroit seed v1, distilled from StageDoor's ledger (eng:one-step-reversible)
