name: Dead code surfaces
decisions:
  - id: eng:dead-code-surfaces
    decision: >-
      Dead code surfaces the day it dies: a one-way ratchet checks that every exported symbol has an
      importer, every store action a caller, and every endpoint a caller or a written justification.
      The baseline only shrinks. The check names its own limits (module-graph reachability, name
      reference, path shape) so a green result is never read as proving more than its axis.
    rejected:
      - >-
        periodic audits — a one-time audit found thousands of dead lines precisely because nothing
        surfaced them at death; an audit's findings are stale the week after
      - deleting without a ratchet — the same classes of dead code re-accumulate at the same rate
context:
  why: >-
    without a standing check, dead code accumulates invisibly until someone pays for an audit whose
    findings immediately go stale
  src: adroit seed v1, distilled from StageDoor's ledger (eng:dead-code-surfaces)
