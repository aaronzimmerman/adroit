id: eng:react-with-vite
name: React with vite
decision: The UI is built in React, and the project builds with Vite.
rejected:
  - >-
    Svelte or another capable framework — nothing wrong with them; they lost on one criterion: the
    builder here is a coding agent, and the boring pair is the one agents know cold
  - >-
    no framework at all — panels, forms and search results are cheap in a framework and expensive
    without one
context: Chosen for builder-agent familiarity over taste.
