id: eng:one-time-renderer
decision: >-
  One shared helper renders clock and date values for humans. A wall-clock time is
  rendered with its zone NAMED rather than converted — the authored clock is the truth —
  and the zone label is omitted rather than guessed when the zone is unknown or
  unparseable.
rejected: []
links:
  domain: eng
context:
  why: >-
    de-skinned from a backend time-resolver ruling: divergent private rendering copies
    drift, and a wall clock someone authored is honored by labelling, never by conversion
  src: adroit seed v1, distilled from StageDoor's ledger (cal:one-backend-time-renderer)
