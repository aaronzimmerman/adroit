id: principle:weigh-disruption
decision: >-
  Weigh disruption, not just fitness — every node of the hierarchy carries its own tolerance for
  disruption, decaying as adoption grows, and a change is judged against the tolerance of the
  subtree it touches: a new feature inside a mature product is greenfield even while its parent is
  locked. Better in a vacuum is not better here. At full disruptability the mandate inverts — every
  new decision must consider upending the entire hierarchy for a better organization; below
  tolerance a change ships only with a migration story, announcements, and training, or it waits.
rejected:
  - >-
    judging changes on fitness alone — a reorganization that is right in a vacuum still breaks
    users, muscle memory, and integrations that the vacuum doesn't contain
  - >-
    a global freeze once users arrive — mature systems still evolve; the coefficient prices the
    change, it never forbids it
links: {}
context:
  why: >-
    user-directed 2026-09-23: different systems have different tolerance for change, and the lever
    moves over time — a greenfield system is mandated to consider total reorganization, a product
    with a million daily users requires care, clean migration stories, training, announcements.
    Generalizes the reasoning that already made models first-class (migration cost); the per-tree
    coefficient is declared on product roots and capabilities (four-roots proposal) and consulted by
    the nomination tooling — a suggested feature-move or capability promotion below the target's
    tolerance must carry its migration story
  src: tasks/082-user-notes.md message 65; session 2026-09-23
  area: >-
    a principle of ADROIT ITSELF (user, message 66) — not coupled to any StageDoor decision; belongs
