id: eng:one-time-renderer
name: One time renderer
decision: >-
  One shared helper renders clock and date values for humans. A wall-clock time is rendered with its
  zone NAMED rather than converted — the authored clock is the truth — and the zone label is omitted
  rather than guessed when the zone is unknown or unparseable.
context: >-
  Divergent private rendering copies drift, and a wall clock someone authored is honored by
  labelling, never by conversion.
