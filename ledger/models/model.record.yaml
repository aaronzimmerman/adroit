id: model:record
summary: >-
  One decision at rest: the unit every tree holds, every edit targets, and every
  citation names. Flat by rule (adr:models-flat-views-derived); the field list is
  closed (eng:decision-per-file — the check refuses fields outside it).
fields:
  id: >-
    scalar — the record's name, domain:slug, unique across the corpus
    (eng:namespace-names-kind); every reference binds to it, never to a path
    (adr:hierarchy-is-filesystem). Written once at mint and never edited
    (ui:all-but-id-editable); read by every citation, binding and file path
  decision: >-
    scalar — the rule, stated so a reader can comply or detect violation; rules,
    never implementation (eng:rules-not-implementation). Written by the walk that
    rules it; read as law by every agent and probe
  rejected: >-
    scalar — the live alternatives that lost, each with its reason; required
    structure, so an empty list is visible (eng:decision-per-file), and the
    defense of counterintuitive rulings at zero context
    (eng:rejected-proves-deliberation). Read by every future reader tempted to
    re-propose a loser
  links: >-
    reference — typed edges to other records by name: grounds, consumes, tension,
    refines (usually omitted; the path carries it), plus classifiers like domain
    (adr:links-typed-by-relation). Read by impact analysis and the dependence
    graph (principle:scrutiny-follows-dependence)
  commitments: >-
    scalar list of entry objects, each one of three forms and this exact
    spelling (eng:commitments-endure-until-canceled): a DECLARATION
    {id, description, severable: false only to mark one no descendant may
    negate} binding the whole subtree; an ADHERENCE {id, adherence: one line on
    how this decision plays out under it}, legal only where the id is in force;
    or a NEGATION {id, negation: true}, one-way below and a hard incoherence
    against an unseverable declaration. A root consuming a capability also
    inherits the contract's commitments by incorporation. Load-bearing; read by
    tooling to derive effective sets and lens views
    (ui:commitments-always-visible)
  dubious: >-
    scalar, optional — one line saying why the record is suspected of no longer
    being coherent; absent when it is not (ui:dubious-is-recorded). Written by
    the commit that edits or moves something the record depends on
    (ui:edits-cast-suspicion), or by hand when a person observes a
    contradiction; removed when the record is confirmed or edited. Read by
    every view that shows the record
  questions: >-
    scalar list, optional — one-line open questions recording tensions the
    decision carries (eng:questions-hold-open-tension). Written by hand or by a
    builder that meets a tension; removed when answered or dropped. Casts no
    suspicion when written or removed. Read by every view that shows the record
    and counted, never faulted, by the check
  context: >-
    scalar — non-load-bearing rationale and provenance (why, src, revisions);
    nothing in it may be needed to comply with the rule (eng:decision-per-file).
    Written at mint and revision; read by humans, never by compliance
