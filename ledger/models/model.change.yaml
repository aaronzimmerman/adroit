id: model:change
summary: >-
  A migration IN FLIGHT at rest: the enduring consequence of a committed
  decision once code is actively two-phasing toward the ruled shape. It lives
  in the pending-changes directory under the models root
  (adr:four-decision-roots), is born when the compliance effort on the ruled
  divergence begins — until then the divergence stays as pending entries in
  the model file itself, and beginning the migration moves those entries here,
  so each lives in one place at a time — and is deleted when the user attests the migration
  has shipped and the model file takes the new shape in the same act
  (change-propose land-migration; adr:models-memorialize-deployed-shape); git
  is its archive.
fields:
  name: >-
    scalar — the pending change's name, unique among open pendings; the handle
    the UI, agents and the migration work refer to it by
  origin: >-
    reference — the decision ids whose committing ruled this change into
    existence (eng:changes-are-projectable); read to answer "why must this
    migrate"
  operations: >-
    scalar list — the normalized field changes, each naming its model field and
    carrying CURRENT (the deployed shape, which the model file keeps stating)
    and INTENDED (the ruled shape); projecting them onto the model shows the
    migration's from-what-to-what (change-propose contract, set-model-field)
  state: >-
    scalar — where the change stands between ruled and deployed; surfaced as
    pending-migration divergence wherever the model appears
    (ui:current-and-proposed-visible), never written into the model file
